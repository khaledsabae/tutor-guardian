name: almorabbi
description: "المربي الذكي — مساعد تربوي إسلامي آمن للأهل (Flutter / Android-first)."
publish_to: 'none'
version: 1.0.56+101

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP + SSE streaming
  http: ^1.2.2

  # IDs + secure storage
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Markdown rendering of assistant replies
  # flutter_markdown was discontinued upstream; flutter_markdown_plus is the
  # maintained fork the pub listing points to, with the same API.
  flutter_markdown_plus: ^1.0.1

  # Arabic-friendly fonts
  google_fonts: ^6.2.1

  # Offline detection
  connectivity_plus: ^6.0.5

  # Persistent on-device flags (onboarding completion, last active child).
  shared_preferences: ^2.3.2

  # Open the privacy policy from the Settings screen.
  url_launcher: ^6.3.0

  # Share + screenshot for share cards
  share_plus: ^11.0.0
  screenshot: ^3.0.0
  # Native in-app review (Phase 0.3 — ratings velocity for ASO)
  in_app_review: ^2.0.10
  # QR code on share cards (Phase 0.1 — deep-link install path)
  qr_flutter: ^4.1.0
  # Play Install Referrer — free referral attribution (Phase 0.2)
  play_install_referrer: ^0.5.0
  # Lottie animations for brand-aligned celebrations
  lottie: ^3.3.0
  # File picker for backup import/export
  file_picker: ^8.0.0
  package_info_plus: ^9.0.1

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  # Background playback for screen-off listening. The screen is dark and the
  # phone is face down — without this the OS suspends playback the moment the
  # app loses focus, which is every time a child puts the phone down, which is
  # the entire mode. `just_audio_background` rather than `audio_service`: it
  # is the notification-and-session shim just_audio needs and nothing else.
  just_audio_background: ^0.0.1-beta.17
  record: ^5.1.2
  path_provider: ^2.1.4
  scrollable_positioned_list: ^0.3.8
  video_player: ^2.8.2

  # Visual redesign — code-only animation primitives (no asset files).
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Local push notifications for daily adhkar
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Keep screen on during story reading.
  wakelock_plus: ^1.2.11

  # Firebase
  flame: ^1.16.0
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.4.0
  # Phase 1 — server-side push re-engagement
  firebase_messaging: ^15.2.0
  # Phase 1 — optional identity that survives reinstall
  google_sign_in: ^6.2.0
  # Phase 0/1 — deep links + whatsapp direct share
  app_links: ^6.3.3
  page_flip: ^0.2.5+1
  animated_book_widget: ^1.0.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    # Named on its own line even though `assets/data/` already sweeps it in.
    # `storiesProvider` falls back to the bundle **silently** when the network
    # fetch times out, so an English reader whose bundle is missing this file
    # does not see an error — they see Arabic. Anything whose absence is
    # invisible at runtime is worth making visible here.
    - assets/data/stories_en.json
    - assets/images/
    - assets/images/logo.png
    # Milestones that still use legacy art (kept until regenerated).
    # Unified brand visual set — logo-centric (crescent+book+sprout+star),
    # generated via ops/tools/gen_visuals.py (Recraft V3). Replaces the old
    # mascot/empty/domains/onboarding directories.
    - assets/images/generated/
    - assets/images/stories/
    # Brand-aligned Lottie celebrations (generated via ops/tools/gen_lottie.py)
    - assets/animations/
    - assets/audio/
    # App content, one pack per file, suffixed with its locale. These were Dart
    # `const` literals until 2026-08-13; ops/tools/extract_app_content.py moved
    # them and proves the move byte-for-byte
    # (`extract_app_content.py verify --rev <commit-before>`). A translation is
    # a sibling file — `*.en.json` — never an edit to the Arabic one.
    - assets/content/games/
    - assets/content/adhkar/
    - assets/content/journey/

# Reuse the existing PWA shield icon — keeps mobile visually consistent
# with the web client and saves us from designing a new asset. Source
# files live at ../frontend/icons/icon-{192,512}.png and were designed
# to match the brand colour #01696F (see frontend/manifest.json).
flutter_launcher_icons:
  image_path: "../frontend/icons/icon-512.png"
  adaptive_icon_background: "#01696F"
  adaptive_icon_foreground: "../frontend/icons/icon-512.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 23

flutter_native_splash:
  color: "#01696F"
  image: "../frontend/icons/icon-512.png"
  android_12:
    color: "#01696F"
    image: "../frontend/icons/icon-512.png"
  ios: false  # iOS in Phase 7

dependency_overrides:
  record_linux: ^1.1.0