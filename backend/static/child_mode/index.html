<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ميزان العادات - وضع المراهق</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    /* The app's dark palette (mobile/lib/theme/app_palette.dart, AppPalette.dark)
       and its font, so the teen page reads as the same product (UX_UI_ROADMAP §4.3). */
    :root {
      --tg-bg: #0A1210; --tg-surface: #131F1C; --tg-track: #20332E;
      --tg-primary: #10B981; --tg-on-primary: #04211B;
      --tg-accent: #FBBF24; --tg-on-accent: #1F1300;
      --tg-ink: #F9FAFB; --tg-text-secondary: #D1D5DB;
    }
    body { font-family: 'Cairo', system-ui, sans-serif; background: var(--tg-bg); color: var(--tg-ink); }
    .tg-muted { color: var(--tg-text-secondary); }
    .tg-title { color: var(--tg-primary); }
    .tg-card { background: var(--tg-surface); border: 1px solid var(--tg-track); }
    .tg-halo { background: color-mix(in srgb, var(--tg-primary) 20%, transparent); color: var(--tg-primary); }
    .tg-btn-primary { background: var(--tg-primary); color: var(--tg-on-primary); }
    /* 48px targets. "Missed" is neutral, never red: a record, not a verdict. */
    .status-btn { min-height: 48px; border: 1px solid var(--tg-track); }
    .btn-done { background: var(--tg-primary); color: var(--tg-on-primary); border-color: var(--tg-primary); }
    .btn-partial { background: var(--tg-accent); color: var(--tg-on-accent); border-color: var(--tg-accent); }
    .btn-missed { background: var(--tg-track); color: var(--tg-ink); }
    .card-enter { animation: cardEnter .35s ease-out both; }
    @keyframes cardEnter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen p-4 flex flex-col">
    <!-- Header -->
    <header class="flex items-center justify-between mb-6 pt-2">
      <div>
        <h1 class="text-2xl font-bold tg-title">ميزان العادات</h1>
        <p id="subtitle" class="text-sm tg-muted">جارٍ التحقق من الجلسة...</p>
      </div>
      <div id="expiry" class="text-xs tg-muted"></div>
    </header>

    <!-- Loading / claim state -->
    <div id="claim-panel" class="hidden flex-1 flex flex-col items-center justify-center text-center space-y-4">
      <div class="w-20 h-20 rounded-full tg-halo flex items-center justify-center">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
      </div>
      <p class="text-lg font-medium">امسح رمز QR من تطبيق المربي</p>
      <p class="text-sm tg-muted">أو افتح الرابط الذي تلقيته عبره.</p>
    </div>

    <!-- Habits list -->
    <main id="habits" class="hidden flex-1 space-y-3"></main>

    <!-- Empty / done state -->
    <div id="empty" class="hidden flex-1 flex flex-col items-center justify-center text-center space-y-3">
      <div class="text-5xl">🌟</div>
      <p class="text-lg font-medium">تم تسجيل كل عادات اليوم</p>
      <p class="text-sm tg-muted">أحسنت! غداً نبدأ صفحة جديدة.</p>
    </div>

    <!-- Error state -->
    <div id="error" class="hidden flex-1 flex flex-col items-center justify-center text-center space-y-4">
      <div class="text-5xl">🔒</div>
      <p id="error-title" class="text-lg font-medium">انتهت الجلسة</p>
      <p id="error-body" class="text-sm tg-muted">يُرجى العودة للمربي لإعادة مسح رمز QR.</p>
      <button id="scan-again" class="px-5 py-3 rounded-lg tg-btn-primary font-bold transition">
        إعادة المسح
      </button>
    </div>

    <footer class="text-center text-xs tg-muted py-4">تطبيق المربي الذكي</footer>
  </div>

  <script>
    const API_BASE = '';
    const TOKEN_KEY='tg_child_web_token';
    const EXPIRES_KEY = 'tg_child_web_expires';

    const $ = id => document.getElementById(id);
    // Habit names include parent-typed custom templates, so they are data,
    // never markup — escape before they reach innerHTML.
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
    const api = async (path, opts = {}) => {
      const token = localStorage.getItem(TOKEN_KEY);
      const headers = { 'Content-Type': 'application/json', ...opts.headers };
      if (token) headers['Authorization'] = `Child-Bearer ${token}`;
      const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
      if (res.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(EXPIRES_KEY);
        showError('انتهت الجلسة', 'يُرجى العودة للمربي لإعادة مسح رمز QR.');
        return null;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.status === 204 ? null : res.json();
    };

    function showPanel(name) {
      ['claim-panel','habits','empty','error'].forEach(id => $(id).classList.add('hidden'));
      $(name).classList.remove('hidden');
    }

    function showError(title, body) {
      $('error-title').textContent = title;
      $('error-body').textContent = body;
      showPanel('error');
    }

    async function claimFromUrl() {
      const params = new URLSearchParams(location.search);
      const code = params.get('claim');
      if (!code) return false;
      try {
        const data = await api(`/api/child-web/claim-session?claim=${encodeURIComponent(code)}`, { method: 'POST' });
        if (!data) return false;
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(EXPIRES_KEY, data.expires_at);
        $('subtitle').textContent = `مرحباً ${data.child_name}`;
        renderExpiry(data.expires_at);
        await loadHabits();
        history.replaceState({}, '', '/child-mode/web/');
        return true;
      } catch (err) {
        showError('رمز QR منتهي', 'اطلب من المربي إصدار رمز جديد.');
        return true;
      }
    }

    function renderExpiry(iso) {
      const d = iso ? new Date(iso) : null;
      $('expiry').textContent = d ? `تنتهي الجلسة: ${d.toLocaleTimeString('ar-SA', { hour:'2-digit', minute:'2-digit' })}` : '';
    }

    async function loadHabits() {
      try {
        const data = await api('/api/value-tracking/child-mode/today');
        if (!data) return;
        $('subtitle').textContent = `مرحباً ${data.child_name || ''}`;
        const events = data.events || [];
        const habits = (data.habits || []).filter(h => !events.some(e => e.habit_name === h.habit_name));
        renderExpiry(localStorage.getItem(EXPIRES_KEY));

        if (!habits.length) {
          showPanel('empty');
          return;
        }

        const container = $('habits');
        container.innerHTML = '';
        habits.forEach((h, i) => {
          const el = document.createElement('div');
          el.className = 'card-enter tg-card rounded-2xl p-4 shadow-lg';
          el.style.animationDelay = `${i * 60}ms`;
          el.innerHTML = `
            <div class="flex items-center gap-3 mb-3">
              <div class="text-2xl">${esc(categoryIcon(h.category))}</div>
              <div>
                <h3 class="font-bold">${esc(h.habit_name)}</h3>
                <p class="text-xs tg-muted">${esc(categoryLabel(h.category))}</p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <button data-status="completed" class="status-btn btn-done rounded-lg font-bold text-sm transition">تم</button>
              <!-- The API's status is "partially"; "partial" was rejected on every tap. -->
              <button data-status="partially" class="status-btn btn-partial rounded-lg font-bold text-sm transition">جزئي</button>
              <button data-status="missed" class="status-btn btn-missed rounded-lg font-bold text-sm transition">لم يتم</button>
            </div>
          `;
          el.querySelectorAll('.status-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              el.querySelectorAll('.status-btn').forEach(b => { b.disabled = true; b.classList.add('opacity-50'); });
              await submit(h.habit_name, h.category, btn.dataset.status, el);
            });
          });
          container.appendChild(el);
        });
        showPanel('habits');
      } catch (err) {
        showError('خطأ في التحميل', 'تعذر الوصول للخادم. تأكد من الاتصال بالإنترنت.');
      }
    }

    async function submit(habitName, category, status, card) {
      try {
        const iso = new Date().toISOString();
        await api('/api/value-tracking/child-mode/events', {
          method: 'POST',
          body: JSON.stringify({ category, habit_name: habitName, status, device_timestamp: iso })
        });
        card.style.transform = 'scale(0.98)';
        setTimeout(() => loadHabits(), 250);
      } catch (err) {
        card.querySelectorAll('.status-btn').forEach(b => { b.disabled = false; b.classList.remove('opacity-50'); });
        alert('تعذر إرسال التقييم. حاول مرة أخرى.');
      }
    }

    function categoryIcon(cat) {
      // The server's categories (HabitCategory in the app): worship, self_building, study.
      const map = { worship: '🕌', self_building: '🌱', study: '📚' };
      return map[cat] || '✨';
    }
    function categoryLabel(cat) {
      const map = { worship: 'العبادات', self_building: 'بناء الذات', study: 'المذاكرة' };
      return map[cat] || '';
    }

    async function init() {
      const hasToken = localStorage.getItem(TOKEN_KEY);
      if (location.pathname.includes('/claim-session/')) {
        await claimFromUrl();
      } else if (hasToken) {
        await loadHabits();
      } else {
        $('subtitle').textContent = 'امسح رمز QR من تطبيق المربي';
        showPanel('claim-panel');
      }
    }

    $('scan-again').addEventListener('click', () => {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(EXPIRES_KEY);
      $('subtitle').textContent = 'امسح رمز QR من تطبيق المربي';
      showPanel('claim-panel');
    });

    init();
  </script>
</body>
</html>
