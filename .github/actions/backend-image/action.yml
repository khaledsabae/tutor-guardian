name: Backend image (build, smoke, publish)
description: >-
  Builds backend/Dockerfile with BuildKit (layer cache kept in GHCR), runs the
  in-image smoke and the KB integrity check on it (ops/tools/candidate_smoke.sh),
  and — when publishing — promotes that exact image to its tags in GHCR, so the
  production host only ever pulls. GitHub-hosted runners only.

inputs:
  mode:
    description: >-
      check  — pull requests: build, load, smoke; nothing is pushed.
      deploy — deploy.yml on main: publish :<sha> and :main, write the layer cache.
      verify — manual run on a branch: publish :verify-<sha> only (never deployed).
    required: true

outputs:
  image:
    description: The local reference that was smoked.
    value: ${{ steps.build.outputs.image }}
  digest:
    description: Manifest digest of the smoked, published image (deploy/verify).
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    # Test tooling is an external read-only mount in disposable smoke containers,
    # never installed into the candidate image that will be published/deployed.
    - name: Set up Python for isolated smoke tools
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          .github/ci/requirements-dev.lock

    - name: Prepare constrained test tools outside the image
      shell: bash
      run: |
        set -euo pipefail
        tools="$(mktemp -d "$RUNNER_TEMP/candidate-test-tools.XXXXXX")"
        # Hash-locked, production's pins. Only the test tools themselves
        # (--no-deps): what they import besides (packaging, pygments, anyio) is
        # already in the image at the same pinned version, so the mount does not
        # shadow the image's own packages with a second copy.
        python -m pip install --require-hashes --no-deps --only-binary=:all: --no-compile \
          --target "$tools" -r .github/ci/requirements-dev.lock
        # Mount must be readable by the image's non-root appuser (uid 10001).
        chmod -R a+rX "$tools"
        echo "CANDIDATE_TEST_TOOLS_DIR=$tools" >> "$GITHUB_ENV"

    # A container builder (docker-container driver) is what can export the
    # layer cache to a registry. use: false keeps plain `docker build` on the
    # daemon's own builder, so later steps can still build FROM local images.
    - name: Set up Buildx
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        use: false

    # The job's own token: write when publishing, read for the cache on PRs.
    # login-action logs out again in its post step.
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build (and push a candidate when publishing)
      id: build
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BUILDER: ${{ steps.buildx.outputs.name }}
        IMAGE: ghcr.io/khaledsabae/tutor-guardian-backend
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        case "$MODE" in check|deploy|verify) ;; *) echo "::error::unknown mode $MODE"; exit 1 ;; esac
        # The layer cache lives in the registry as $IMAGE:buildcache, so an
        # unchanged pip/torch/model layer keeps its digest from build to build
        # — which is what lets the production host pull only the app layers.
        args=(-f backend/Dockerfile --builder "$BUILDER" --provenance=false
              --cache-from "type=registry,ref=$IMAGE:buildcache"
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY"
              --label "org.opencontainers.image.revision=$SHA")
        size() { numfmt --to=iec --suffix=B "$(docker image inspect --format '{{.Size}}' "$1")"; }
        if [ "$MODE" = check ]; then
          docker buildx build "${args[@]}" --load -t tg-candidate:ci .
          echo "image=tg-candidate:ci" >> "$GITHUB_OUTPUT"
          echo "image size: $(size tg-candidate:ci) unpacked"
          exit 0
        fi
        docker buildx build "${args[@]}" \
          --cache-to "type=registry,ref=$IMAGE:buildcache,mode=max" \
          --push -t "$IMAGE:candidate-$SHA" .
        # Smoke what the registry holds — the very bytes production will pull.
        docker pull "$IMAGE:candidate-$SHA"
        digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:candidate-$SHA")
        echo "image=$IMAGE:candidate-$SHA" >> "$GITHUB_OUTPUT"
        echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
        packed=$(docker buildx imagetools inspect --raw "$digest" \
          | python3 -c 'import json, sys; print(sum(l["size"] for l in json.load(sys.stdin)["layers"]))')
        echo "pushed and pulled back $digest"
        echo "image size: $(size "$IMAGE:candidate-$SHA") unpacked, $(numfmt --to=iec --suffix=B "$packed") to pull"

    # The same wrapper (and limits) the deploy used to run on the VPS.
    - name: In-image smoke and KB integrity
      shell: bash
      run: |
        set -euo pipefail
        ops/tools/candidate_smoke.sh "${{ steps.build.outputs.image }}"
        ops/tools/candidate_smoke.sh "${{ steps.build.outputs.image }}" "" \
          -- python ops/tools/check_kb_integrity.py

    # Only now does the image get a name production can deploy: the tags are
    # created on the registry from the smoked manifest — nothing is rebuilt.
    - name: Promote the smoked image
      if: inputs.mode != 'check'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        IMAGE: ghcr.io/khaledsabae/tutor-guardian-backend
        SHA: ${{ github.sha }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        set -euo pipefail
        if [ "$MODE" = deploy ]; then names=("$SHA" main); else names=("verify-$SHA"); fi
        args=()
        for n in "${names[@]}"; do args+=(-t "$IMAGE:$n"); done
        docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
        # sed, not head: head closes the pipe early, and under pipefail the
        # writer's SIGPIPE fails the step after the tags already exist.
        docker buildx imagetools inspect "$IMAGE:${names[0]}" | sed -n '1,4p'
        echo "Published \`$IMAGE@$DIGEST\` as: ${names[*]}" >> "$GITHUB_STEP_SUMMARY"
