version: 2
updates:
  # Proposals only: production/ML requirements and the observed production
  # constraints are deliberately outside this first automation scope.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    allow:
      - dependency-name: pytest
      - dependency-name: pytest-anyio
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      test-tooling:
        patterns:
          - pytest
          - pytest-anyio
        update-types:
          - minor
          - patch
