name: Backend tests

on:
  push:
    branches: [main]
    # Superset of what production serves. Deploy is NOT gated on this workflow
    # — the workflow_run gate was removed to avoid Actions billing. deploy.yml
    # runs pytest and the KB integrity check inside the candidate image instead,
    # before the production container is recreated, so a red suite still never
    # reaches production. This job is the GitHub-hosted second opinion.
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'pytest.ini'
      - '.github/workflows/backend.yml'
      - 'frontend/**'
      - 'docs/lesson_index.json'
      - 'docs/lesson_assets/**'
      - 'docker-compose.production.yml'
      - 'requirements*.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'pytest.ini'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# Cancel in-flight runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: none of these jobs writes to the repository.
permissions:
  contents: read

jobs:
  # ── 1. Fast unit tests (no docker, no real LLM) ───────────────────────
  pytest:
    name: pytest
    # C3 (AUDIT_AND_ROADMAP.md): this runner IS the production VPS. Never run
    # code from a fork PR on it — only pushes, manual runs, and PRs whose
    # head branch lives in this repository (pushing one needs write access).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production]
    # 12 was not enough: the first run after re-enabling this workflow was
    # cancelled at 12m12s. Installing backend/requirements.txt (torch, ONNX
    # Runtime, ChromaDB, sentence-transformers) dominates on a cold pip cache,
    # 30 then stopped being enough too: the suite used to run twice, and at
    # ~22 min a pass on this runner (2026-09-27) the second pass was cancelled
    # at 30m with every test already green. One full pass now; see below.
    timeout-minutes: 40
    env:
      # Force tests to skip the network-bound RAG smoke test.
      SKIP_API_SMOKE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Install the curriculum loader's test deps (the test fixture
          # imports knowledge_base modules; we don't need a full
          # install — just ensure PYTHONPATH is correct, which
          # pytest.ini already does via pythonpath = backend).
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run pytest (full suite; the smoke test honours SKIP_API_SMOKE)
        # One pass over everything. There used to be two: `--ignore` of the
        # smoke test, then the full suite "so a misconfigured ignore doesn't
        # mask regressions". The second pass was a strict superset of the
        # first, so the first bought nothing but doubled the time — and that
        # pushed the job past its timeout.
        run: |
          cd "$GITHUB_WORKSPACE"
          pytest -v

  # ── 2. Knowledge-base integrity (catches schema drift) ───────────────
  kb-integrity:
    name: KB integrity
    # C3 (AUDIT_AND_ROADMAP.md): this runner IS the production VPS. Never run
    # code from a fork PR on it — only pushes, manual runs, and PRs whose
    # head branch lives in this repository (pushing one needs write access).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production]
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install KB integrity deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Run check_kb_integrity.py
        run: |
          cd "$GITHUB_WORKSPACE"
          python ops/tools/check_kb_integrity.py

  lint:
    name: ruff
    # C3 (AUDIT_AND_ROADMAP.md): this runner IS the production VPS. Never run
    # code from a fork PR on it — only pushes, manual runs, and PRs whose
    # head branch lives in this repository (pushing one needs write access).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      # Narrow on purpose — see the rule list and reasoning in pyproject.toml.
      # The same invocation runs in .githooks/pre-commit for an instant local
      # answer; this one catches whatever a --no-verify or another machine
      # skipped. Keep the two in step.
      - name: Run ruff
        run: ruff check backend/ ops/ scripts/
