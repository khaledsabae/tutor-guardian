name: Backend tests

on:
  push:
    branches: [main]
    # Superset of what production serves. Deploy is NOT gated on this workflow
    # — the workflow_run gate was removed to avoid Actions billing. deploy.yml
    # runs pytest and the KB integrity check inside the candidate image instead,
    # before the production container is recreated, so a red suite still never
    # reaches production. This job is the GitHub-hosted second opinion.
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'pytest.ini'
      - '.github/workflows/backend.yml'
      - 'frontend/**'
      - 'docs/lesson_index.json'
      - 'docs/lesson_assets/**'
      - 'docker-compose.production.yml'
      - 'requirements*.txt'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'pytest.ini'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

# Cancel in-flight runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Fast unit tests (no docker, no real LLM) ───────────────────────
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    # 12 was not enough: the first run after re-enabling this workflow was
    # cancelled at 12m12s. Installing backend/requirements.txt (torch, ONNX
    # Runtime, ChromaDB, sentence-transformers) dominates on a cold pip cache,
    # and the suite then runs twice on purpose — see the second pytest step.
    # Free on a public repo, so the ceiling is generous rather than tight.
    timeout-minutes: 30
    env:
      # Force tests to skip the network-bound RAG smoke test.
      SKIP_API_SMOKE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Install the curriculum loader's test deps (the test fixture
          # imports knowledge_base modules; we don't need a full
          # install — just ensure PYTHONPATH is correct, which
          # pytest.ini already does via pythonpath = backend).
        env:
          PYTHONDONTWRITEBYTECODE: '1'

      - name: Run pytest (excluding the network smoke test)
        run: |
          cd "$GITHUB_WORKSPACE"
          pytest --ignore=backend/tests/test_api_smoke.py -v

      - name: Run pytest with full suite (skip the smoke test via env)
        # Keep this as a second pass so a misconfigured `ignore` doesn't
        # silently mask regressions. The test internally checks
        # SKIP_API_SMOKE.
        run: |
          cd "$GITHUB_WORKSPACE"
          pytest -v
        env:
          SKIP_API_SMOKE: '1'

  # ── 2. Knowledge-base integrity (catches schema drift) ───────────────
  kb-integrity:
    name: KB integrity
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install KB integrity deps
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Run check_kb_integrity.py
        run: |
          cd "$GITHUB_WORKSPACE"
          python ops/tools/check_kb_integrity.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      # Narrow on purpose — see the rule list and reasoning in pyproject.toml.
      # The same invocation runs in .githooks/pre-commit for an instant local
      # answer; this one catches whatever a --no-verify or another machine
      # skipped. Keep the two in step.
      - name: Run ruff
        run: ruff check backend/ ops/ scripts/
