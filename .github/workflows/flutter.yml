name: Flutter

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: none of these jobs writes to the repository.
permissions:
  contents: read

# Every job runs on GitHub-hosted runners, main included — free for this public
# repository, in parallel, and off the production VPS, which used to run them
# (see the note in backend.yml). flutter-action keeps its default SDK cache key
# (version + arch), the same key mobile-e2e uses, so one SDK copy saved by
# main's runs serves every PR.

jobs:
  # ── 1. Static analysis ────────────────────────────────────────────────
  analyze:
    name: flutter analyze
    # C3 (AUDIT_AND_ROADMAP.md): fork PRs are skipped. Nothing in this workflow
    # runs on the VPS any more, so the guard no longer protects it — it only
    # keeps fork PRs without CI; left as it was until that is decided.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "[measurement — temporary] CPU baseline"
        run: |
          echo "CPU0=$(awk '/^cpu /{print $2+$3+$4}' /proc/stat)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile
        # --fatal-infos turns info-level lints into errors. We want
        # the pipeline to fail on warnings AND on infos so that
        # noise doesn't accumulate.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: "[measurement — temporary] job CPU"
        if: always()
        run: |
          awk -v c0="$CPU0" '/^cpu /{printf "JOB-CPU: %.0f s user+nice+sys since the first step\n", ($2+$3+$4-c0)/100}' /proc/stat

  # ── 2. Unit + widget tests ────────────────────────────────────────────
  test:
    name: flutter test
    # C3 (AUDIT_AND_ROADMAP.md): fork PRs are skipped. Nothing in this workflow
    # runs on the VPS any more, so the guard no longer protects it — it only
    # keeps fork PRs without CI; left as it was until that is decided.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "[measurement — temporary] CPU baseline"
        run: |
          echo "CPU0=$(awk '/^cpu /{print $2+$3+$4}' /proc/stat)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run tests
        working-directory: mobile
        # --reporter expanded gives a clear pass/fail per test
        # --coverage enables coverage output for the report job
        run: flutter test --reporter expanded --coverage

      - name: "[measurement — temporary] job CPU"
        if: always()
        run: |
          awk -v c0="$CPU0" '/^cpu /{printf "JOB-CPU: %.0f s user+nice+sys since the first step\n", ($2+$3+$4-c0)/100}' /proc/stat
