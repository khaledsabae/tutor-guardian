name: Flutter

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: none of these jobs writes to the repository.
permissions:
  contents: read

# Where the jobs run: main (push, or a manual run on main) stays on the VPS
# runner [self-hosted, production], unchanged; pull requests and manual runs on
# other branches go to ubuntu-latest — free for this public repository, in
# parallel, and off the production box. See the same note in backend.yml.
# On a hosted runner flutter-action keeps its default SDK cache key (version +
# arch) — the key mobile-e2e (PR #22) uses too, so one SDK copy can serve every
# hosted job. The VPS keeps its old key.

jobs:
  # ── 1. Static analysis ────────────────────────────────────────────────
  analyze:
    name: flutter analyze
    # C3 (AUDIT_AND_ROADMAP.md): a pull request never reaches the VPS runner —
    # its ref is refs/pull/N/merge, so runs-on below sends it to GitHub-hosted.
    # The fork guard stays as a second line: if that expression ever routes a PR
    # to the VPS again, fork code still cannot run there. Pushes, manual runs and
    # PRs whose head branch lives in this repository (needs write access) run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "production"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
          # VPS: the key it always had. Hosted: '' = the action's default.
          cache-key: ${{ runner.environment != 'github-hosted' && format('flutter-pub-{0}', hashFiles('mobile/pubspec.lock')) || '' }}

      - name: Trust the runner's Flutter checkout
        # The self-hosted runner executes as root while flutter-action
        # unpacks the SDK under a different owner, so every `flutter`
        # invocation dies with "detected dubious ownership" from git's
        # safe.directory check — exit 128 before a single line of Dart is
        # analysed. GitHub-hosted runners never hit this because the tool
        # cache and the job share one user. `*` here rather than the exact
        # path: the SDK directory carries the version, so pinning it would
        # break silently on the next Flutter bump.
        run: git config --global --add safe.directory '*'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile
        # --fatal-infos turns info-level lints into errors. We want
        # the pipeline to fail on warnings AND on infos so that
        # noise doesn't accumulate.
        run: flutter analyze --fatal-infos --fatal-warnings

  # ── 2. Unit + widget tests ────────────────────────────────────────────
  test:
    name: flutter test
    # C3 (AUDIT_AND_ROADMAP.md): a pull request never reaches the VPS runner —
    # its ref is refs/pull/N/merge, so runs-on below sends it to GitHub-hosted.
    # The fork guard stays as a second line: if that expression ever routes a PR
    # to the VPS again, fork code still cannot run there. Pushes, manual runs and
    # PRs whose head branch lives in this repository (needs write access) run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.ref == 'refs/heads/main' && fromJSON('["self-hosted", "production"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
          # VPS: the key it always had. Hosted: '' = the action's default.
          cache-key: ${{ runner.environment != 'github-hosted' && format('flutter-pub-{0}', hashFiles('mobile/pubspec.lock')) || '' }}

      - name: Trust the runner's Flutter checkout
        # The self-hosted runner executes as root while flutter-action
        # unpacks the SDK under a different owner, so every `flutter`
        # invocation dies with "detected dubious ownership" from git's
        # safe.directory check — exit 128 before a single line of Dart is
        # analysed. GitHub-hosted runners never hit this because the tool
        # cache and the job share one user. `*` here rather than the exact
        # path: the SDK directory carries the version, so pinning it would
        # break silently on the next Flutter bump.
        run: git config --global --add safe.directory '*'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run tests
        working-directory: mobile
        # --reporter expanded gives a clear pass/fail per test
        # --coverage enables coverage output for the report job
        run: flutter test --reporter expanded --coverage

  # ── main only: refresh the caches the hosted PR jobs restore ──────────
  # Pull requests can restore caches saved on main, but main's jobs run on the
  # VPS, whose SDK path differs, so nothing they save matches a hosted runner.
  # This saves the hosted SDK (~1.6 GB) and pub cache under main's scope once
  # per Flutter version / pubspec.lock; without it each PR stores its own copy
  # against the repository's 10 GB cache budget. GitHub-hosted: nothing on the VPS.
  hosted-cache:
    name: hosted cache (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies (fills the pub cache)
        working-directory: mobile
        run: flutter pub get
