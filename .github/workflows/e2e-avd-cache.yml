name: E2E AVD cache (main)
# Keeps the emulator snapshot that mobile-e2e.yml restores in a cache scoped to
# main. mobile-e2e.yml runs only for pull requests, and a cache saved by a PR
# (ref refs/pull/N/merge) can be restored by that PR alone, so every new PR
# missed and paid for a cold AVD creation (2026-10-08: the AVD cache missed
# in all three red E2E runs; the only AVD caches were PR-scoped). A PR can
# restore a cache saved on main, so one copy here serves them all.
#
# Cheap when the cache exists (one lookup). Runs daily so an evicted copy (the
# repository's 10 GB cache budget is shared with the Gradle caches) comes back
# within a day, and on a push to main that changes the emulator settings. On a
# pull request that touches this file it creates the AVD but does not save, so
# the change is exercised before it reaches main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/e2e-avd-cache.yml
      - .github/workflows/mobile-e2e.yml
      - e2e/install_system_image.sh
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/e2e-avd-cache.yml
      - e2e/install_system_image.sh
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-avd-cache-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must equal mobile-e2e.yml (e2e/test_workflow.py checks).
  AVD_CACHE_KEY: avd-api35-google_apis-x86_64-pixel_7-r1
  SYSTEM_IMAGE: 'system-images;android-35;google_apis;x86_64'

jobs:
  avd:
    name: Warm the AVD cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Is the AVD cached already?
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE_KEY }}
          lookup-only: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.avd-cache.outputs.cache-hit != 'true'
        with:
          persist-credentials: false
          sparse-checkout: e2e/install_system_image.sh
          sparse-checkout-cone-mode: false

      - name: Enable KVM
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.avd-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the system image (retried, verified)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: bash e2e/install_system_image.sh "$SYSTEM_IMAGE"

      - name: Create the AVD and a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: echo "AVD snapshot generated for caching."

      - name: Save the AVD on main
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE_KEY }}
