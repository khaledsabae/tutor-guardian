name: Mobile E2E (emulator)

# Release gate for «المربّي»: the RELEASE APK of the PR head, driven black-box
# by Maestro on an Android emulator. Release mode is the point — R8/minify
# breakage (e.g. a ComponentRegistrar constructor stripped by full mode, which
# hangs the app on the splash) never shows in `flutter test` or a debug build.
#
# ── Where it runs ────────────────────────────────────────────────────────
# GitHub-hosted ubuntu-latest ONLY (free: the repo is public; KVM works there).
# Never give a job here a self-hosted label: [self-hosted, production] is the
# production VPS. Nothing in this workflow runs on Khaled's machine either.
#
# ── Stable required check ────────────────────────────────────────────────
# Every PR targeting main runs this workflow, and "Mobile delivery gate" (the
# one required status check on main) always reports. There is deliberately NO
# workflow-level `paths:` filter: a filtered-out PR would wait forever for a
# required check that never comes. Instead the first job, `changes`, reads the
# PR's file list and decides what the change can reach:
#   app        → everything below (four APKs, journeys, rehearsal). The APK
#                is built from mobile/ alone, so: mobile/**, e2e/**,
#                frontend/icons/** (the launcher-icon source pubspec.yaml
#                names), this workflow and e2e-avd-cache.yml.
#   candidate  → the rehearsal pair only (keystore, the two rehearsal APKs,
#                the rehearsal). The rehearsal builds the PR head's backend
#                image and the app talks to it, so whatever that image serves
#                to the app counts: backend/** (not backend/tests/**),
#                knowledge_base/**, docs/** (not docs/marketing/**),
#                .well-known/**, .github/ci/requirements-prod.lock,
#                .dockerignore. The journeys are skipped: their APK talks to
#                PRODUCTION, so they never see a PR's backend.
#   neither    → every heavy job is skipped; the gate passes in a minute.
# workflow_dispatch, an empty file list and a list at the API's 3000-file cap
# all count as `app` (the full suite). The gate (always()) requires `changes`
# to succeed with an explicit verdict, every job that verdict needs to
# succeed, and every other job to be skipped — so a failure, a cancellation,
# a missing result or a broken `changes` job still cannot make it green.
# e2e/test_workflow.py executes both the classifier and the gate.
# Manual workflow_dispatch remains available for baseline/upgrade validation.
#
# ── What it checks (e2e/run.sh, flows in e2e/flows/) ──────────────────────
# Lineage "fresh" — PR head, fresh install, Arabic UI, one process for 01-06:
#   01 onboarding → child in band 7-9 → Today renders
#   02 Today → first lesson → back       03 assistant streams an answer
#   04 child mode in → PIN out           05 dark mode
#   06 English → Today/Learn/Assistant/More
#   07 force-stop → cold start → Today renders (no white screen, no spinner,
#      not stuck in child mode)          08 the child survived that restart
#   09 family programs list → Prayer Journey (read-only)
# Lineage "upgrade" — BASELINE build: 01 English onboarding + child,
#   02 restart on the baseline (control, informational), then `adb install -r`
#   the PR head: 03 it opens and Today renders, 04 the child is kept (skipped
#   when the control shows the baseline already lost it). run.sh also checks
#   firstInstallTime survived (an in-place upgrade, data kept).
# Lineage "gallery" — informational, never gates: the baseline photographed
#   («before»), then `adb install -r` the head and the same shots «after» —
#   Arabic and English plus a 200%-font pass (a runtime system setting, so the
#   AVD cache key is untouched). Paired into the e2e-gallery artifact by
#   e2e/e2e_tool.py gallery.
# Logcat is captured for the whole run; the job fails on a FATAL EXCEPTION or
# native crash in the app, an ANR, or a Flutter/Dart error (e2e/e2e_tool.py).
# Selectors are ARB keys (e2e/e2e_tool.py l10n), so copy edits do not break
# flows and every selector matches Arabic and English alike.
#
# ── Baseline (the build users have now) ─────────────────────────────────
# Default: efaa740f = released 1.0.68+113. E2E_BASELINE_REF is also set to
# this released commit; explicit manual input still takes precedence.
# After each Play release, point it at the released commit: the repository
# variable E2E_BASELINE_REF (Settings → Variables), or the default below.
# A manual run can pass any ref as `baseline_ref`.
#
# ── Test traffic in PRODUCTION — how to exclude it ──────────────────────
# A release build talks to https://tg-api.alsaba.cloud. Each lineage creates one
# child (fresh, upgrade, gallery — three per run since the gallery lineage),
# created under the fixed name below (built into the CI APK, no rename):
#   column  child_profiles.name      value  LIKE 'E2E-Maestro%'
#   devices WITH e2e AS (SELECT device_id FROM child_profiles WHERE name LIKE 'E2E-Maestro%')
#           SELECT device_id FROM e2e
#           UNION SELECT device_id FROM push_tokens          -- the install's twin, see below
#                 WHERE token IN (SELECT token FROM push_tokens WHERE device_id IN (SELECT device_id FROM e2e))
#   device-keyed tables (every table with device_id): device_id NOT IN (<devices>)
#   child-keyed tables:  child_id NOT IN (SELECT id FROM child_profiles WHERE name LIKE 'E2E-Maestro%')
#   the one question per run: chat_messages.content LIKE 'E2E test%'
# Twins: until the device identity race is fixed, a fresh install mints TWO
# device ids at first launch (seen in production for ~35% of installs that
# registered a child in the 30 days to 2026-10-04); the childless one shares the
# install's FCM token, which is how the rule above catches it. Verified on run
# 37188547221: the rule returned exactly its 4 devices and nothing else.
# A run that dies before onboarding leaves only childless devices (a token, an
# empty chat session, a push token); exclude them by the UTC window printed in
# the job summary.
# GA4: both CI APKs inject firebase_analytics_collection_deactivated=true
# before building. Collection stays disabled even if app code enables it.
# The packaged ci-config.txt records this CI-only configuration; production
# manifests and release workflows retain their normal Analytics settings.
# Crashlytics: E2E devices report as model sdk_gphone64_x86_64 (filter it out).
#
# ── Signing ──────────────────────────────────────────────────────────────
# No secrets. One throwaway debug-style keystore per run (password "android")
# signs both APKs through android/app/key.properties written in CI, so the
# upgrade's `install -r` sees one signer. It lives one day as an artifact of
# this run and signs nothing that ships.
#
# Artifacts: e2e-screenshots (checkpoint PNGs), e2e-logcat (+ gate verdict),
# e2e-maestro-report (JUnit, Maestro output, failure screenshots, summary),
# e2e-gallery (gallery-summary.md + the paired images — the معرض قبل/بعد of
# docs/NOOR_WAL_QANADIL_PLAN.md Phase 0: the baseline build and the PR head
# photographed side by side, Arabic/English plus a 200%-font pass; run.sh's
# gallery lineage is informational and never gates the run).
#
# ── Ramadan rehearsal (job `rehearsal`, e2e/rehearsal.sh) — gate G2 ──────
# docs/NOOR_WAL_QANADIL_PLAN.md phase 5: walk a family through Ramadan on the
# emulator months ahead — 30 days before, days 1/15/27, Eid, after — in
# Arabic, English and dark, upgrading from the build on Play. The backend's
# date override (`as_of`, honoured only with PROGRAMS_AS_OF_ENABLED) must
# NEVER be switched on in production, so this job brings its own server: the
# PR head's backend image, built here from the GHCR layer cache and run on the
# runner's loopback with the switch on (a fresh SQLite DB, a throwaway
# CHILD_MODE_SECRET, no .env, no production anything). Two more APK variants
# point at it with --dart-define=API_BASE_URL=http://10.0.2.2:8090 (cleartext
# to 10.0.2.2 is allowed by network_security_config):
#   rehearsal-head      the PR head (+ E2E_PROBES=true, the sound check's key
#                       probe — mobile/lib/core/e2e_probes.dart; compiled out
#                       of every other build)
#   rehearsal-baseline  the build on Play: v1.0.72+117 (c3087014) unless the
#                       manual input `rehearsal_baseline_ref` says otherwise
# Neither app sends `as_of` — the Play build cannot, and the head must not
# ship a date knob — so `e2e_tool.py as-of-proxy` on :8090 adds the stage's
# date to every family-programs call on its way to the candidate on :8091.
# The stage dates come from the server's own season (as-of-preflight), which
# also proves, before any emulator, that the candidate answers each date.
# Then, on the same emulator, the sound × recitation check of the plan's
# phase-2 gate: a recitation in the Quran reader, interface ticks through
# the probe (a system light/dark change — `cmd uimode night` — reaches the app
# whatever holds the focus; F12 did not), and `dumpsys audio` as the witness:
# the recitation's player is still started and no tick asked for audio focus.
# Its verdict is the «SOUND×RECITATION CHECKPOINT» line in the log and the job
# summary.
# Artifact: e2e-rehearsal (stage gallery, screenshots, proxy log, audio
# dumps, preflight, backend log, logcat, Maestro reports).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Commit/tag of the build users run now (upgrade test starts there). Empty = E2E_BASELINE_REF or efaa740f (1.0.68+113).'
        required: false
        type: string
        default: ''
      rehearsal_baseline_ref:
        description: 'The Play build the Ramadan rehearsal upgrades from. Empty = c3087014 (v1.0.72+117).'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'
  MAESTRO_VERSION: '2.11.0'
  # checksums_sha256.txt of the cli-2.11.0 release
  MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
  # Bump the suffix when the emulator settings below change — here AND in
  # e2e-avd-cache.yml, which keeps this key warm on main (test_workflow.py
  # checks the two match). This workflow runs only for PRs, and a PR's cache is
  # visible to that PR alone, so without the main copy every new PR missed.
  AVD_CACHE_KEY: avd-api35-google_apis-x86_64-pixel_7-r1
  SYSTEM_IMAGE: 'system-images;android-35;google_apis;x86_64'

jobs:
  changes:
    name: What the change can reach
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # the PR's file list, nothing else
    outputs:
      app: ${{ steps.classify.outputs.app }}
      candidate: ${{ steps.classify.outputs.candidate }}
    steps:
      # The API's list is the PR's own diff (merge base → head), renames with
      # both names. It stops at 3000 files; the classifier treats that as app.
      - name: List the PR's files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
                 --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/pr-files.txt"; then
              echo "$(wc -l < "$RUNNER_TEMP/pr-files.txt") paths listed"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::could not list the PR's files"
          exit 1

      - name: Decide which suites the change can reach
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          FILES: ${{ runner.temp }}/pr-files.txt
        run: |
          python3 - <<'PY'
          import os

          # The release APK is built from mobile/ alone (flutter build reads
          # nothing outside it); e2e/ drives it; frontend/icons/ is the icon
          # source pubspec.yaml names; the two workflows are this suite.
          APP_PREFIXES = ('mobile/', 'e2e/', 'frontend/icons/')
          APP_FILES = {'.github/workflows/mobile-e2e.yml', '.github/workflows/e2e-avd-cache.yml'}
          # What backend/Dockerfile puts in the rehearsal's candidate image and
          # the app can reach through it (the app fetches /docs/ — stories,
          # lesson assets). Not runtime: backend tests, marketing copy; the
          # landing pages (frontend/) and ops/ scripts are never on the app's path.
          CANDIDATE_PREFIXES = ('backend/', 'knowledge_base/', 'docs/', '.well-known/')
          CANDIDATE_FILES = {'.github/ci/requirements-prod.lock', '.dockerignore'}
          NOT_CANDIDATE = ('backend/tests/', 'docs/marketing/')
          API_CAP = 3000

          def reaches_app(p):
              return p in APP_FILES or p.startswith(APP_PREFIXES)

          def reaches_candidate(p):
              return p in CANDIDATE_FILES or (p.startswith(CANDIDATE_PREFIXES)
                                              and not p.startswith(NOT_CANDIDATE))

          event = os.environ['EVENT']
          if event != 'pull_request':
              app, why = True, f'{event}: always the full suite'
              cand, cand_hits = True, []
              app_hits = []
          else:
              with open(os.environ['FILES'], encoding='utf-8') as f:
                  files = [l for l in f.read().splitlines() if l]
              app_hits = [p for p in files if reaches_app(p)]
              cand_hits = [p for p in files if reaches_candidate(p)]
              if not files:
                  app, why = True, 'empty file list: full suite to be safe'
              elif len(files) >= API_CAP:
                  app, why = True, f'{len(files)} paths (API cap {API_CAP}): full suite to be safe'
              else:
                  app = bool(app_hits)
                  why = f'{len(files)} paths, {len(app_hits)} reach the app, {len(cand_hits)} the candidate backend'
              cand = app or bool(cand_hits)

          verdict = 'app' if app else ('candidate' if cand else 'neither')
          lines = [f'Change detection: **{verdict}** ({why})']
          for label, hits in (('app', app_hits), ('candidate backend', cand_hits)):
              if hits:
                  lines.append(f'- reaches the {label}: ' + ', '.join(f'`{p}`' for p in hits[:20])
                               + (f' … +{len(hits) - 20}' if len(hits) > 20 else ''))
          print('\n'.join(lines))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"app={'true' if app else 'false'}\n")
              out.write(f"candidate={'true' if cand else 'false'}\n")
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as s:
                  s.write('\n'.join(lines) + '\n')
          PY

  keystore:
    name: CI debug keystore
    needs: changes
    if: needs.changes.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Supply the head helper independently: old baseline refs lack this command.
      # Sparse checkout avoids downloading the repository's large content assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: e2e/e2e_tool.py
          sparse-checkout-cone-mode: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-ci-helper
          path: e2e/e2e_tool.py
          if-no-files-found: error
          retention-days: 1

      - name: Generate a throwaway debug keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-debug-keystore
          path: ${{ runner.temp }}/debug.keystore
          retention-days: 1

  build:
    name: Release APK (${{ matrix.variant }})
    needs: [changes, keystore]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: head
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            dart_defines: ''
            child_name: E2E-Maestro
          - variant: baseline
            ref: ${{ inputs.baseline_ref || vars.E2E_BASELINE_REF || 'efaa740f48389636ea4bf06b6a71bbe3f324e8bc' }}
            dart_defines: ''
            child_name: E2E-Maestro
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-debug-keystore
          path: ${{ runner.temp }}/keystore

      - name: Sign with it
        # android/app/key.properties is the project's own signing switch
        # (build.gradle.kts). Pointing it at the run's keystore is explicit;
        # relying on AGP's default debug keystore was not — on the runner AGP
        # signed with a key of its own, which would break `install -r`.
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/keystore/debug.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > android/app/key.properties

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-ci-helper
          path: ${{ runner.temp }}/ci-helper

      - name: Deactivate Firebase Analytics for CI APKs
        # Pure stdlib head helper, applied to BOTH matrix checkout manifests.
        # https://firebase.google.com/docs/analytics/android/configure-data-collection
        shell: bash
        run: |
          set -euo pipefail
          python3 -S "$RUNNER_TEMP/ci-helper/e2e_tool.py" deactivate-analytics --manifest android/app/src/main/AndroidManifest.xml

      - name: Create the onboarding child as test traffic
        # The onboarding child is created as matrix.child_name — the CHILD_NAME
        # default of e2e/run.sh (head/baseline: the name every production
        # exclusion query keys on) or e2e/rehearsal.sh — instead of being
        # renamed after onboarding. Production answers a rename with 403
        # device_proof_required until the session proves itself through an FCM
        # push (MOBILE_API §9.0.1), which a CI emulator receives only now and
        # then; creating a child needs no proof.
        shell: bash
        env:
          CHILD_NAME: ${{ matrix.child_name }}
        run: |
          set -euo pipefail
          python3 -S "$RUNNER_TEMP/ci-helper/e2e_tool.py" ci-child-name --l10n-dir lib/l10n --name "$CHILD_NAME"

      - name: Build the release APK (x86_64, as the emulator runs it)
        # R8 full mode + shrinkResources run exactly as for Play; only the ABI
        # is narrowed to the emulator's. head/baseline pass no define at all;
        # the rehearsal pair's defines are in the matrix above.
        env:
          DART_DEFINES: ${{ matrix.dart_defines }}
        run: flutter build apk --release --target-platform android-x64 $DART_DEFINES

      - name: Check the signer is the run's keystore
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          got=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          want=$(keytool -list -v -keystore "$RUNNER_TEMP/keystore/debug.keystore" -storepass android -alias androiddebugkey \
                 | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "signer $got"
          [ -n "$got" ] && [ "$got" = "$want" ] || { echo "::error::APK signer $got is not the run keystore $want"; exit 1; }

      - name: Package APK + its ARB strings
        env:
          VARIANT: ${{ matrix.variant }}
          DART_DEFINES: ${{ matrix.dart_defines }}
          CHILD_NAME: ${{ matrix.child_name }}
        run: |
          OUT="$RUNNER_TEMP/e2e-apk"
          mkdir -p "$OUT/l10n"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT/app.apk"
          cp lib/l10n/app_ar.arb lib/l10n/app_en.arb "$OUT/l10n/"
          echo "$VARIANT $(git rev-parse --short HEAD) $(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" > "$OUT/ref.txt"
          printf '%s\n' 'signing=ci-debug-keystore' 'firebase_analytics_collection_deactivated=true' "dart_defines=$DART_DEFINES" "onboarding_child_name=$CHILD_NAME" > "$OUT/ci-config.txt"
          cat "$OUT/ref.txt"; ls -la "$OUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-apk-${{ matrix.variant }}
          path: ${{ runner.temp }}/e2e-apk
          retention-days: 7

  # The rehearsal pair: the same steps as `build` (e2e/test_workflow.py
  # checks they stay identical), a job of its own so a backend-only change can
  # run the rehearsal without the journeys' two APKs.
  build_rehearsal:
    name: Release APK (${{ matrix.variant }})
    needs: [changes, keystore]
    if: needs.changes.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # The Ramadan rehearsal's pair (job `rehearsal`): both talk to the
          # candidate backend on the runner, never to production. Only the
          # rehearsal head carries the sound check's key probe.
          - variant: rehearsal-head
            ref: ${{ github.event.pull_request.head.sha || github.sha }}
            dart_defines: '--dart-define=API_BASE_URL=http://10.0.2.2:8090 --dart-define=E2E_PROBES=true'
            child_name: E2E-Rehearsal
          - variant: rehearsal-baseline
            ref: ${{ inputs.rehearsal_baseline_ref || 'c30870145dda59acffd63b68784ad6f9e0974ca5' }}
            dart_defines: '--dart-define=API_BASE_URL=http://10.0.2.2:8090'
            child_name: E2E-Rehearsal
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-debug-keystore
          path: ${{ runner.temp }}/keystore

      - name: Sign with it
        # android/app/key.properties is the project's own signing switch
        # (build.gradle.kts). Pointing it at the run's keystore is explicit;
        # relying on AGP's default debug keystore was not — on the runner AGP
        # signed with a key of its own, which would break `install -r`.
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/keystore/debug.keystore"
            echo "storePassword=android"
            echo "keyAlias=androiddebugkey"
            echo "keyPassword=android"
          } > android/app/key.properties

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-ci-helper
          path: ${{ runner.temp }}/ci-helper

      - name: Deactivate Firebase Analytics for CI APKs
        # Pure stdlib head helper, applied to BOTH matrix checkout manifests.
        # https://firebase.google.com/docs/analytics/android/configure-data-collection
        shell: bash
        run: |
          set -euo pipefail
          python3 -S "$RUNNER_TEMP/ci-helper/e2e_tool.py" deactivate-analytics --manifest android/app/src/main/AndroidManifest.xml

      - name: Create the onboarding child as test traffic
        # The onboarding child is created as matrix.child_name — the CHILD_NAME
        # default of e2e/run.sh (head/baseline: the name every production
        # exclusion query keys on) or e2e/rehearsal.sh — instead of being
        # renamed after onboarding. Production answers a rename with 403
        # device_proof_required until the session proves itself through an FCM
        # push (MOBILE_API §9.0.1), which a CI emulator receives only now and
        # then; creating a child needs no proof.
        shell: bash
        env:
          CHILD_NAME: ${{ matrix.child_name }}
        run: |
          set -euo pipefail
          python3 -S "$RUNNER_TEMP/ci-helper/e2e_tool.py" ci-child-name --l10n-dir lib/l10n --name "$CHILD_NAME"

      - name: Build the release APK (x86_64, as the emulator runs it)
        # R8 full mode + shrinkResources run exactly as for Play; only the ABI
        # is narrowed to the emulator's. head/baseline pass no define at all;
        # the rehearsal pair's defines are in the matrix above.
        env:
          DART_DEFINES: ${{ matrix.dart_defines }}
        run: flutter build apk --release --target-platform android-x64 $DART_DEFINES

      - name: Check the signer is the run's keystore
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          got=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          want=$(keytool -list -v -keystore "$RUNNER_TEMP/keystore/debug.keystore" -storepass android -alias androiddebugkey \
                 | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "signer $got"
          [ -n "$got" ] && [ "$got" = "$want" ] || { echo "::error::APK signer $got is not the run keystore $want"; exit 1; }

      - name: Package APK + its ARB strings
        env:
          VARIANT: ${{ matrix.variant }}
          DART_DEFINES: ${{ matrix.dart_defines }}
          CHILD_NAME: ${{ matrix.child_name }}
        run: |
          OUT="$RUNNER_TEMP/e2e-apk"
          mkdir -p "$OUT/l10n"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT/app.apk"
          cp lib/l10n/app_ar.arb lib/l10n/app_en.arb "$OUT/l10n/"
          echo "$VARIANT $(git rev-parse --short HEAD) $(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')" > "$OUT/ref.txt"
          printf '%s\n' 'signing=ci-debug-keystore' 'firebase_analytics_collection_deactivated=true' "dart_defines=$DART_DEFINES" "onboarding_child_name=$CHILD_NAME" > "$OUT/ci-config.txt"
          cat "$OUT/ref.txt"; ls -la "$OUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-apk-${{ matrix.variant }}
          path: ${{ runner.temp }}/e2e-apk
          retention-days: 7

  e2e:
    name: Emulator journeys (API 35)
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # 75 min covered the 13 journeys; the informational gallery lineage (a
    # third onboarding plus six shoots, two of them at 200% font) needs
    # roughly half that again on a slow emulator.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Paths
        # `runner.temp` is not available to job-level env.
        run: |
          echo "E2E_APKS=$RUNNER_TEMP/e2e/apks" >> "$GITHUB_ENV"
          echo "E2E_OUT=$RUNNER_TEMP/e2e/out" >> "$GITHUB_ENV"

      - name: Unit-test the E2E tooling
        # The gate's tests print what the gate prints in a real run, `::error::`
        # included, and the runner turns any such stdout line into an annotation
        # on this job. Until 2026-10-08 every E2E run carried a false "logcat has
        # only 10 lines — capture failed" from one test, and red runs were
        # rerun for a capture that had in fact recorded 60–90k lines. Commands
        # are paused while the tests run (e2e/test_workflow.py checks this).
        run: |
          python3 -m pip install PyYAML==6.0.2
          token="e2e-unit-tests-$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          rc=0
          python3 -m unittest discover -s e2e -v || rc=$?
          echo "::$token::"
          exit "$rc"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-apk-head
          path: ${{ env.E2E_APKS }}/head

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-apk-baseline
          path: ${{ env.E2E_APKS }}/baseline

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          BIN=$(dirname "$(find "$RUNNER_TEMP/maestro-cli" -path '*/bin/maestro' -type f | head -1)")
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/maestro" --version

      # The action downloads the image once per job without retrying; a corrupt
      # download (2026-10-08) left no emulator at all. Already installed, the
      # action skips it.
      - name: Install the system image (retried, verified)
        run: bash e2e/install_system_image.sh "$SYSTEM_IMAGE"

      - name: Restore the AVD
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE_KEY }}

      - name: Create the AVD and a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: echo "AVD snapshot generated for caching."

      - name: Save the AVD (now, so a red run still caches it)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE_KEY }}

      - name: Run the journeys
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: bash e2e/run.sh

      - name: Job summary
        if: always()
        run: |
          if [ -f "$E2E_OUT/summary.md" ]; then cat "$E2E_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ env.E2E_OUT }}/screens
          if-no-files-found: warn
          retention-days: 14

      # The قبل/بعد pairs: gallery-summary.md + images/, built by run.sh's
      # gallery lineage (e2e/e2e_tool.py gallery). warn, not error: a run that
      # reached no gallery shot still uploads everything else.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-gallery
          path: ${{ env.E2E_OUT }}/gallery
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-logcat
          path: ${{ env.E2E_OUT }}/logcat
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-maestro-report
          path: |
            ${{ env.E2E_OUT }}/maestro
            ${{ env.E2E_OUT }}/device
            ${{ env.E2E_OUT }}/summary.md
            ${{ env.E2E_OUT }}/meta.md
            ${{ env.E2E_OUT }}/results.tsv
          if-no-files-found: warn
          retention-days: 14

  rehearsal:
    name: Ramadan rehearsal + sound × recitation (API 35)
    needs: [changes, build_rehearsal]
    if: needs.changes.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    # Backend image (~3 min from the layer cache), boot, then ~24 stage walks
    # and the sound check on one emulator.
    timeout-minutes: 100
    permissions:
      contents: read
      packages: read   # the backend image's layer cache in GHCR (read only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Paths
        run: |
          echo "E2E_APKS=$RUNNER_TEMP/e2e/apks" >> "$GITHUB_ENV"
          echo "E2E_OUT=$RUNNER_TEMP/e2e/out" >> "$GITHUB_ENV"

      - name: Room for a backend image beside the emulator
        # The image is ~3 GB unpacked, the AVD and system image a few more.
        # Toolchains this job never uses go first.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/nonexistent}/CodeQL" || true
          df -h / | tail -1

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          use: false

      - name: Build the candidate — the PR head's backend image
        # The same Dockerfile and layer cache as the deploy's image
        # (.github/actions/backend-image); loaded locally, pushed nowhere.
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/khaledsabae/tutor-guardian-backend
        run: |
          set -euo pipefail
          # Read-only access to the cache. Without it the build is slower, not different.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin \
            || echo "::warning::GHCR login failed — building without the layer cache"
          docker buildx build -f backend/Dockerfile --builder "$BUILDER" --provenance=false \
            --cache-from "type=registry,ref=$IMAGE:buildcache" --load -t tg-rehearsal:ci .
          docker logout ghcr.io || true
          echo "image size: $(numfmt --to=iec --suffix=B "$(docker image inspect --format '{{.Size}}' tg-rehearsal:ci)") unpacked"

      - name: Start the candidate with PROGRAMS_AS_OF_ENABLED=1 (runner loopback only)
        # A fresh SQLite DB inside the container, a throwaway child-mode
        # secret, no .env and no volume: nothing of production's, and nothing
        # outside this runner can reach it. The emulator does, through the
        # as-of proxy on :8090 that e2e/rehearsal.sh starts.
        run: |
          set -euo pipefail
          CHILD_MODE_SECRET=$(openssl rand -hex 16) PROGRAMS_AS_OF_ENABLED=1 \
            docker run -d --name tg-rehearsal -p 127.0.0.1:8091:8000 \
              -e CHILD_MODE_SECRET -e PROGRAMS_AS_OF_ENABLED tg-rehearsal:ci
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://127.0.0.1:8091/health; then
              echo "candidate healthy after ~${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs tg-rehearsal 2>&1 | tail -80
          echo "::error::the candidate backend never answered /health"
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-apk-rehearsal-head
          path: ${{ env.E2E_APKS }}/rehearsal-head

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-apk-rehearsal-baseline
          path: ${{ env.E2E_APKS }}/rehearsal-baseline

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          BIN=$(dirname "$(find "$RUNNER_TEMP/maestro-cli" -path '*/bin/maestro' -type f | head -1)")
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/maestro" --version

      - name: Install the system image (retried, verified)
        run: bash e2e/install_system_image.sh "$SYSTEM_IMAGE"

      # The AVD the journeys use, from the same cache key. A miss builds it
      # here; saving is left to the e2e job and e2e-avd-cache.yml.
      - name: Restore the AVD
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ env.AVD_CACHE_KEY }}

      - name: Create the AVD and a boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: echo "AVD snapshot generated for caching."

      - name: Run the rehearsal and the sound check
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          cores: 3
          disk-size: 6000M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: bash e2e/rehearsal.sh

      - name: Candidate backend log
        if: always()
        run: |
          mkdir -p "$E2E_OUT/rehearsal"
          docker logs tg-rehearsal > "$E2E_OUT/rehearsal/backend.log" 2>&1 || true
          docker rm -f tg-rehearsal >/dev/null 2>&1 || true

      - name: Job summary
        if: always()
        run: |
          if [ -f "$E2E_OUT/summary.md" ]; then cat "$E2E_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-rehearsal
          path: |
            ${{ env.E2E_OUT }}/gallery
            ${{ env.E2E_OUT }}/rehearsal
            ${{ env.E2E_OUT }}/screens
            ${{ env.E2E_OUT }}/maestro
            ${{ env.E2E_OUT }}/logcat
            ${{ env.E2E_OUT }}/device
            ${{ env.E2E_OUT }}/summary.md
            ${{ env.E2E_OUT }}/meta.md
            ${{ env.E2E_OUT }}/results.tsv
          if-no-files-found: warn
          retention-days: 14

  delivery_gate:
    name: Mobile delivery gate
    if: ${{ always() }}
    needs: [changes, keystore, build, build_rehearsal, e2e, rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job the change needs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_JSON"])
          changes = results.get("changes") or {}
          outputs = changes.get("outputs") or {}
          verdict = (outputs.get("app"), outputs.get("candidate"))
          if changes.get("result") != "success" or not set(verdict) <= {"true", "false"}:
              print("::error::Change detection did not decide: "
                    f"changes={changes.get('result', 'missing')}, app={verdict[0]}, candidate={verdict[1]}")
              sys.exit(1)
          app = verdict[0] == "true"
          candidate = app or verdict[1] == "true"
          required = set()
          if candidate:
              required |= {"keystore", "build_rehearsal", "rehearsal"}
          if app:
              required |= {"build", "e2e"}
          failed = []
          for job in ("keystore", "build", "build_rehearsal", "e2e", "rehearsal"):
              result = (results.get(job) or {}).get("result", "missing")
              if job in required and result != "success":
                  failed.append(f"{job}={result}")
              elif job not in required and result != "skipped":
                  failed.append(f"{job}={result} (expected skipped)")
          if failed:
              print("::error::Mandatory mobile delivery jobs did not succeed: " + ", ".join(failed))
              sys.exit(1)
          scope = "app: full suite" if app else ("candidate backend: rehearsal only" if candidate else "neither: nothing to run")
          print(f"Change reaches {scope}; every job it needs succeeded ({', '.join(sorted(required)) or 'none'}).")
          PY
