name: Deploy

# Auto-deploy the backend to the VPS on push to main. Three jobs:
#
#   gate    GitHub-hosted. Waits for "Backend tests" (backend.yml: pytest, KB
#           integrity, ruff — all GitHub-hosted) to pass for THIS commit, and
#           fails closed otherwise (ops/tools/deploy_gate.py, which also says
#           why this is an API check and not `on: workflow_run`). Nothing below
#           runs until it passes; it holds no production runner while it waits.
#   deploy  ON the VPS (self-hosted runner `vps-tg`, locally — no SSH). Builds a
#           candidate image, runs a ~1 CPU-minute smoke and the KB integrity
#           check inside it (CPU-capped, low-priority, no network), backs up the
#           data, recreates the container from that image, and rolls back if
#           it is not healthy.
#   alert   ON the VPS (the Telegram credentials live in its .env). Fires when
#           the gate or the deploy failed or was cancelled.
#
# The full test suite used to run inside the candidate image here, on the
# production host — 16-28 min a deploy on 2026-10-04, 75+ min once the host
# was CPU-throttled, while backend.yml ran the same suite on the same box. It
# now runs once, on GitHub-hosted runners, and this workflow waits for it.
#
# Manual run: Actions → Deploy → "Run workflow". Main only; gated the same way.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'ops/scripts/**'
      - 'frontend/**'
      - 'docs/lesson_index.json'
      - 'docs/lesson_assets/**'
      - 'docker-compose.production.yml'
      - 'backend/Dockerfile'
      - '.github/workflows/deploy.yml'
      - 'requirements*.txt'
      - '.github/ci/constraints-prod.txt'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel an in-flight deploy

jobs:
  gate:
    name: Backend tests passed for this commit
    runs-on: ubuntu-latest
    # Hosted tests take ~3-5 min; the script's own budget is 50 min.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout (the gate script only)
        uses: actions/checkout@v5
        with:
          sparse-checkout: ops/tools

      - name: Wait for pytest, KB integrity and ruff on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/tools/deploy_gate.py --sha "${{ github.sha }}"

  deploy:
    name: Deploy to VPS (self-hosted)
    needs: gate
    runs-on: [self-hosted, production]
    timeout-minutes: 90
    environment:
      name: production
      url: https://tg-api.alsaba.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build the candidate image and smoke it
        run: |
          set -euo pipefail
          CANDIDATE_TAG="tutor-guardian-backend:candidate-${{ github.sha }}"
          # Persistent layer cache between runs. The build context is the
          # checked-out workspace (wiped after every run), so without a cache
          # every deploy rebuilds pip/models from scratch (~69 min) and the
          # 90-min timeout dies mid-export. buildx with a local cache dir on
          # the runner reuses layers across runs — the second build is a
          # fraction of the first.
          CACHE_DIR="/var/cache/tutor-guardian-buildx"

          # Disk first. On 2026-09-27 the runner — which is the production
          # host — ran out of space mid-deploy: the test run died with
          # "database or disk is full" and the same disk holds the live DB.
          # Reclaim what is safe to reclaim, then refuse to build on a disk
          # that cannot take a ~13 GB candidate image.
          echo "=== Disk before build ==="
          df -h / | tail -1
          du -sh "$CACHE_DIR" 2>/dev/null || true
          free_gb() { df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          if [ "$(free_gb)" -lt 25 ]; then
            echo "::warning::low disk ($(free_gb) GB free) — pruning dangling images and build cache"
            docker image prune -f >/dev/null 2>&1 || true
            docker builder prune -f --filter until=72h >/dev/null 2>&1 || true
            rm -rf "${CACHE_DIR}-new"
            df -h / | tail -1
          fi
          if [ "$(free_gb)" -lt 15 ]; then
            echo "::error::only $(free_gb) GB free on the production host — not building. Free space (docker system df) and re-run."
            exit 1
          fi

          echo "=== Build candidate image from checked-out workspace ==="
          # Use $GITHUB_WORKSPACE (the commit that triggered this workflow), not
          # /root/tutor-guardian, so tests gate the exact code being deployed.
          cd "$GITHUB_WORKSPACE"
          # The local cache exporter never drops old blobs when it writes into
          # an existing directory, so exporting into $CACHE_DIR itself grew it
          # by the changed layers on every deploy, forever. Export to a fresh
          # directory and swap it in: the cache holds exactly this build's
          # layers, which is all the next build can reuse anyway.
          rm -rf "${CACHE_DIR}-new"
          docker buildx build \
            --cache-from "type=local,src=$CACHE_DIR" \
            --cache-to "type=local,dest=${CACHE_DIR}-new,mode=max" \
            -f backend/Dockerfile -t "$CANDIDATE_TAG" .
          rm -rf "$CACHE_DIR"
          mv "${CACHE_DIR}-new" "$CACHE_DIR"

          # Two hard caps, because the swap above bounds the export dir but not
          # what BuildKit keeps for itself. On 2026-09-27 the export dir was
          # 4.6 GB after a cold build while the builder's own cache stood at
          # 27.8 GB — a second copy of the same layers, never pruned.
          #  * builder cache: capped at 10 GB (keeps the most recent records);
          #  * export dir: a runaway above 12 GB is dropped — the next build is
          #    cold (slower), which beats filling the disk that holds the live DB.
          docker builder prune -f --max-used-space 10gb >/dev/null 2>&1 || true
          CACHE_MAX_GB=12
          cache_gb=$(du -s --block-size=1G "$CACHE_DIR" | cut -f1)
          if [ "$cache_gb" -gt "$CACHE_MAX_GB" ]; then
            echo "::warning::buildx cache is ${cache_gb} GB (> ${CACHE_MAX_GB}) — dropping it"
            rm -rf "$CACHE_DIR"
          fi
          echo "=== Disk after build ==="
          df -h / | tail -1
          du -sh "$CACHE_DIR" 2>/dev/null || true

          # The suite itself already passed on GitHub-hosted runners (the gate
          # job). What only this host can check is the image it just built: it
          # imports, loads both baked models offline, migrates a fresh DB, boots
          # and answers /health and /api/app-config, and passes a small pytest
          # subset — ops/tools/candidate_smoke.py, ~1 CPU-minute. The wrapper
          # caps the container at one core with a low CPU weight, 4 GB and no
          # network, so the live sites keep the host. The same wrapper, on the
          # same Dockerfile, runs in the candidate-image workflow on PRs —
          # with three sabotaged images that the smoke must reject.
          # Named containers: if this job is cancelled, the cleanup step removes
          # them — killing `docker run` does not stop its container.
          echo "=== In-image smoke ==="
          ops/tools/candidate_smoke.sh "$CANDIDATE_TAG" "tg-candidate-smoke-${{ github.run_id }}"

          echo "=== KB integrity check in the candidate image ==="
          ops/tools/candidate_smoke.sh "$CANDIDATE_TAG" "tg-candidate-kb-${{ github.run_id }}" \
            -- python ops/tools/check_kb_integrity.py

          echo "=== Candidate image passed all gates ==="

          # Promote the tested candidate to the tag compose resolves for this
          # service. Compose derives `<project>-<service>` from the deploy dir,
          # i.e. tutor-guardian-backend:latest, and the service declares no
          # explicit `image:` key — so tagging here lets the deploy step start
          # the *already tested* image instead of rebuilding it.
          #
          # This used to be a second `docker compose build backend` run from
          # /root/tutor-guardian. Different build context = no layer cache reuse,
          # so a ~5.7GB image was built twice per run; "exporting layers" alone
          # measured 238s. Three deploys in a row blew timeout-minutes: 30 and
          # were cancelled mid-export (2026-07-27).
          echo "=== Tag candidate as tutor-guardian-backend:latest ==="
          docker tag "$CANDIDATE_TAG" tutor-guardian-backend:latest

      - name: Deploy backend locally on the VPS
        run: |
          set -euo pipefail
          DEPLOY_PATH="/root/tutor-guardian"
          DEPLOY_HEALTH_URL="https://tg-api.alsaba.cloud/health"

          echo "=== Self-hosted deploy ==="
          echo "Date:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deploy path: $DEPLOY_PATH"
          echo "Health URL:  $DEPLOY_HEALTH_URL"
          echo

          cd "$DEPLOY_PATH"

          # ── 1. Record previous SHA + image for rollback ──────────────
          PREVIOUS_SHA=$(git rev-parse HEAD)
          echo "Previous SHA: $PREVIOUS_SHA"

          # The running container pins its image by ID, so this still resolves
          # to the *old* image even though the previous step already moved the
          # :latest tag onto the new candidate. Capturing it lets rollback
          # restore the exact image that was last verified healthy in
          # production, with no rebuild — see _rollback() below.
          PREVIOUS_IMAGE=$(docker inspect tg_backend --format '{{.Image}}' 2>/dev/null || true)
          echo "Previous image: ${PREVIOUS_IMAGE:-<none>}"

          # ── 2. Check out exactly the commit the gate approved ────────
          # Not origin/main: main may already be ahead, and the bind mounts
          # below (docs, ops/scripts — the crons run from here — mobile/assets)
          # must come from the tested commit, like the image does. The newer
          # commit gets its own gated deploy.
          echo "→ git fetch + reset --hard $GITHUB_SHA (the tested commit)"
          git fetch origin main
          git reset --hard "$GITHUB_SHA"
          DEPLOY_SHA=$(git rev-parse --short HEAD)
          echo "Deploying SHA: $DEPLOY_SHA"

          # ── 2b. Does this host actually hold what the index promises? ─
          # Media is gitignored and arrives by rsync, so the candidate image
          # cannot check it — .dockerignore strips docs/*.mp3 and *.mp4. This
          # path is the only place both the index and the real files exist.
          # It caught nothing before it was written, which is the point: on
          # 2026-08-10 the index named 7 path videos that were never generated
          # (18 lessons served dead links) and one MP3 that three different
          # lessons played. Blocking since run 31396853692 came through clean
          # ("every referenced file is on this host", "no podcast is shared").
          # A failure here stops the deploy before the container is touched, so
          # production keeps serving the last good index.
          echo "→ checking served assets against docs/"
          # nice: host-side work on a shared, CPU-starved box yields to the
          # live sites. (The image build cannot be niced from here — BuildKit
          # runs inside dockerd — but its heavy layers are cache hits unless
          # requirements or the Dockerfile changed.)
          nice -n 10 python3 ops/tools/check_served_assets.py

          # ── 3. Verify the tested image is present ────────────────────
          # No build here: the previous step already built, tested and tagged
          # tutor-guardian-backend:latest. The checkout above still has to be
          # current because the compose file bind-mounts ./docs,
          # ./backend/secrets, ./ops/scripts and ./mobile/assets from this dir.
          echo "→ verifying tutor-guardian-backend:latest exists"
          docker image inspect tutor-guardian-backend:latest >/dev/null

          # ── 3b. Make the data volumes writable by the container user ──
          # The image runs as `appuser` (uid 10001) but Docker creates volume
          # contents as root, so SQLite could read the DB and not write it —
          # `PRAGMA journal_mode = WAL` then fails and the container crashloops
          # on startup. That took production down on 2026-07-25 and had already
          # failed the 2026-07-19 deploy; prod had been surviving on a single
          # container that could never be restarted. Idempotent, so it also
          # covers any freshly created volume.
          echo "→ ensuring volume ownership (uid 10001)"
          for _vol in tutor-guardian_tg_sessions tutor-guardian_tg_chroma; do
            _path=$(docker volume inspect "$_vol" --format '{{.Mountpoint}}' 2>/dev/null || true)
            if [ -n "$_path" ] && [ -d "$_path" ]; then
              chown -R 10001:10001 "$_path" || echo "::warning::chown failed for $_vol"
            fi
          done

          # ── 3c. Make read-only bind mounts readable by the container user ──
          # Same uid mismatch as 3b, other direction: these are host dirs, not
          # volumes. docs/ is rsynced from the dev machine and arrives owned by
          # uid 1000 mode 0600, which uid 10001 cannot read. On 2026-07-27 that
          # left 421 of 1594 docs files unreadable, so /privacy-policy answered
          # 200 with an empty body and Cloudflare turned it into a 520 — the
          # deploy smoke test then rolled back with no usable diagnosis.
          # These three mounts are public content, so a+rX is the right state;
          # backend/secrets is deliberately excluded — it must stay 0600.
          echo "→ ensuring bind-mount readability (docs, ops/scripts, mobile/assets)"
          for _dir in docs ops/scripts mobile/assets; do
            [ -d "$_dir" ] && { chmod -R a+rX "$_dir" || echo "::warning::chmod failed for $_dir"; }
          done

          # Secrets get the opposite treatment: owned by the container user and
          # readable by nobody else. Same 0600 root:root symptom as docs/ — it
          # made _load_credentials() raise PermissionError, so push notifications
          # were dead in production — but a+rX would be the wrong cure here.
          if [ -d backend/secrets ]; then
            echo "→ ensuring secrets are container-readable and private (0400, uid 10001)"
            chown -R 10001:10001 backend/secrets || echo "::warning::chown failed for backend/secrets"
            find backend/secrets -type f -exec chmod 400 {} + || echo "::warning::chmod failed for backend/secrets"
          fi

          # ── 3d. Verified backup of the user data BEFORE the new image ──
          # The new image may migrate the schema on startup (v27 rebuilds
          # child_challenges). _rollback() restores the previous IMAGE, not the
          # data, so a verified copy has to exist first. Same script as the
          # nightly cron (online backup API + integrity_check + gzip) — a
          # failure here stops the deploy before the container is touched.
          # Skipped only when there is no running container to back up.
          if docker inspect -f '{{.State.Running}}' tg_backend 2>/dev/null | grep -q true; then
            echo "→ pre-deploy backup of /app/ops/*.db"
            BACKUP_ROOT=/root/tg-backups nice -n 10 ops/scripts/backup_user_data.sh
            # Read-only schema preflight: integrity_check and no child with two
            # active challenges (the v27 partial index would reject that).
            nice -n 10 ops/scripts/migrate_schema_v27.sh preflight
          else
            echo "::warning::tg_backend not running — skipping pre-deploy backup"
          fi

          # ── 4. Recreate the container ────────────────────────────────
          echo "→ docker compose up -d --no-build backend"
          docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans backend

          # ── Helper: rollback to previous SHA ─────────────────────────
          _rollback() {
            echo "::warning::Rolling back to SHA: $PREVIOUS_SHA ..."
            git reset --hard "$PREVIOUS_SHA"
            # Prefer re-tagging the image that was actually running and healthy
            # before this deploy — it needs no rebuild (a rebuild here would hit
            # the same multi-minute export that caused the timeouts, so a slow
            # rollback is a rollback that gets cancelled). Fall back to building
            # only when there was no prior container, e.g. first-ever deploy.
            if [ -n "$PREVIOUS_IMAGE" ] && docker image inspect "$PREVIOUS_IMAGE" >/dev/null 2>&1; then
              echo "::warning::Restoring previous image $PREVIOUS_IMAGE"
              docker tag "$PREVIOUS_IMAGE" tutor-guardian-backend:latest
              docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans backend
            else
              echo "::warning::No previous image available — rebuilding from $PREVIOUS_SHA"
              docker compose -f docker-compose.production.yml build backend
              docker compose -f docker-compose.production.yml up -d --remove-orphans backend
            fi
            echo "::warning::Rollback complete."
          }

          # ── 5. Wait for the new container to be healthy ──────────────
          # Cold start loads the embedding model weights + ChromaDB, which
          # routinely takes >60s. 180s was enough until a boot that also has
          # to REBUILD the index: on 2026-08-13 the HNSW bloat guard purged
          # and re-embedded 864 units, the app logged "startup complete" and
          # answered /health 200 — seconds after attempt 36 had already given
          # up. The deploy rolled a healthy release back, and the units it
          # carried never reached production while the logs showed a clean
          # boot. A rebuild is exactly when a deploy most needs patience, so
          # the ceiling has to clear it: 420s.
          echo "→ waiting for container health (up to 420s)"
          STATUS="missing"
          for i in $(seq 1 84); do
            sleep 5
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' tg_backend 2>/dev/null || echo "missing")
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
          done

          if [ "$STATUS" != "healthy" ]; then
            echo "::error::tg_backend is not healthy after 180s — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          # ── 6. HTTP smoke test ───────────────────────────────────────
          # No -f: it makes curl exit non-zero on an HTTP error, so the old
          # `|| echo "fail"` *appended* to the code already on stdout and
          # reported nonsense like "520fail". Without -f curl exits 0 and
          # %{http_code} is the code on its own.
          echo "→ HTTP smoke test: $DEPLOY_HEALTH_URL"
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$DEPLOY_HEALTH_URL" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health URL returned $HTTP_CODE (expected 200) — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          # ── 7. Privacy endpoint (Phase 0 regression) ─────────────────
          # -w also reports the body size: this endpoint once answered 200 with
          # zero bytes (unreadable bind-mounted file), which Cloudflare masked
          # as a 520, so an empty body is itself a failure worth naming.
          PRIVACY_OUT=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' --max-time 30 "${DEPLOY_HEALTH_URL%/health}/privacy-policy" || echo "000 0")
          PRIVACY_CODE=${PRIVACY_OUT%% *}
          PRIVACY_BYTES=${PRIVACY_OUT##* }
          if [ "$PRIVACY_CODE" != "200" ] || [ "$PRIVACY_BYTES" -eq 0 ]; then
            echo "::error::privacy-policy returned $PRIVACY_CODE with $PRIVACY_BYTES bytes (expected 200, non-empty) — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          echo
          echo "=== Deploy complete ==="
          echo "SHA:  $DEPLOY_SHA"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Runs on cancellation and failure too, not just success. Cleanup used to
      # be the last block of the deploy step, so the three runs cancelled at the
      # 30-minute mark each stranded a ~13GB candidate image on the VPS.
      - name: Cleanup candidate image
        if: always()
        run: |
          # A cancelled run leaves its `docker run` container running (the
          # client dies, the container does not): remove the smoke containers
          # by name first. No-ops after a normal run (--rm already did it).
          docker rm -f "tg-candidate-smoke-${{ github.run_id }}" \
                       "tg-candidate-kb-${{ github.run_id }}" >/dev/null 2>&1 || true
          # Untags only — after a successful deploy this image is also tagged
          # :latest and backs the running container, so it survives as :latest.
          docker image rm "tutor-guardian-backend:candidate-${{ github.sha }}" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true
          docker images tutor-guardian-backend --format '  {{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'

      - name: Post-deploy log tail
        if: always()
        run: |
          echo "=== Last 30 lines of tg_backend (post-deploy) ==="
          docker logs --tail 30 tg_backend 2>&1 || echo "(no logs available)"

  # A failed deploy used to be silent. On 2026-08-14 two consecutive runs
  # failed on the served-assets guard (702b723, f1f9453) and nobody found
  # out for three hours — main simply stopped reaching production while
  # every local signal said the work was pushed and done.
  #
  # Its own job since the gate exists: a red gate skips the deploy job, and a
  # skipped job runs none of its steps. It runs on the VPS runner because the
  # credentials come from the same .env the app uses (0600, root, and the
  # runner is root) — no GitHub secret. The token is never echoed — it enters
  # the URL from the environment at run time and does not appear in this file
  # or in the log.
  #
  # ⚠️ Covers a *failed or cancelled run*. It cannot cover a run that never
  # started — a dead runner, or a push whose paths all miss the filters
  # above. The drift check in ops/tools/check_deploy_drift.py is what
  # catches those, because it compares production against origin/main
  # instead of watching this workflow.
  alert:
    name: Alert on failed deploy
    needs: [gate, deploy]
    if: ${{ always() && (needs.gate.result == 'failure' || needs.gate.result == 'cancelled' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    runs-on: [self-hosted, production]
    timeout-minutes: 5
    steps:
      - name: Send the Telegram alert
        run: |
          set -eu
          cd /root/tutor-guardian
          set -a; . ./.env; set +a
          : "${TELEGRAM_BOT_TOKEN:?missing}" "${TELEGRAM_CHAT_ID:?missing}"

          RUNNING_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo '?')
          CONTAINER=$(docker ps --format '{{.Status}}' --filter name=tg_backend | head -1)
          HEALTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   https://tg-api.alsaba.cloud/health || echo 'unreachable')

          if [ "${{ needs.gate.result }}" != "success" ]; then
            HINT1='البوابة: اختبارات Backend tests لم تنجح لهذا الكوميت،'
            HINT2='فلم يُلمَس الإنتاج. السبب في رابط التشغيل أعلاه.'
          else
            HINT1='الخطوة الفاشلة في اللوج. لو الحارس هو السبب،'
            HINT2='الأرجح ملف ميديا في الفهرس ولم يصل بالـrsync.'
          fi

          TEXT=$(printf '%s\n' \
            '🔴 نشر المربّي فشل — main لم يصل الإنتاج' \
            '' \
            "الحالة:    gate=${{ needs.gate.result }} · deploy=${{ needs.deploy.result }}" \
            "الكوميت:   ${{ github.sha }}" \
            "على الخادم: $RUNNING_SHA" \
            "الحاوية:   ${CONTAINER:-<لا توجد>}" \
            "‎/health:  $HEALTH" \
            '' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '' \
            "$HINT1" \
            "$HINT2")

          curl -sS --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg_alert_resp.json -w 'telegram HTTP %{http_code}\n'
          # Telegram answers HTTP 200 with ok=false for a wrong chat_id, so the
          # alert is confirmed by the response body — an alert that silently
          # fails to send is the exact failure this whole step exists to end.
          python3 -c 'import json,sys; d=json.load(open("/tmp/tg_alert_resp.json")); print("telegram ok=", d.get("ok"), "message_id=", (d.get("result") or {}).get("message_id")); sys.exit(0 if d.get("ok") else 1)'
