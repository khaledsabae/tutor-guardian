name: Deploy

# Auto-deploy the backend to the VPS on push to main.
#
# Runs ON the self-hosted runner (`vps-tg`) which lives on the VPS itself,
# so it executes the deploy LOCALLY — no SSH, no GitHub-hosted minutes, and
# fully independent of GitHub Actions billing.
#
# Previously this was gated on the "Backend tests" GitHub-hosted workflow, but
# that workflow is disabled to avoid Actions billing. Instead, the deploy job
# builds a *candidate* image and runs pytest + KB integrity inside it BEFORE
# recreating the production container. A red test suite therefore never reaches
# production.
#
# Manual run: Actions → Deploy → "Run workflow" (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'ops/scripts/**'
      - 'frontend/**'
      - 'docs/lesson_index.json'
      - 'docs/lesson_assets/**'
      - 'docker-compose.production.yml'
      - 'backend/Dockerfile'
      - '.github/workflows/deploy.yml'
      - 'requirements*.txt'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy to VPS (self-hosted)
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    environment:
      name: production
      url: https://tg-api.alsaba.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build candidate image and run tests
        run: |
          set -euo pipefail
          CANDIDATE_TAG="tutor-guardian-backend:candidate-${{ github.sha }}"

          echo "=== Build candidate image from checked-out workspace ==="
          # Use $GITHUB_WORKSPACE (the commit that triggered this workflow), not
          # /root/tutor-guardian, so tests gate the exact code being deployed.
          cd "$GITHUB_WORKSPACE"
          docker build -f backend/Dockerfile -t "$CANDIDATE_TAG" .

          echo "=== Run backend tests in candidate image ==="
          docker run --rm \
            -e SKIP_API_SMOKE=1 \
            -e PYTHONPATH=/app/backend \
            "$CANDIDATE_TAG" \
            pytest -q

          echo "=== Run KB integrity check in candidate image ==="
          docker run --rm \
            -e PYTHONPATH=/app/backend \
            "$CANDIDATE_TAG" \
            python ops/tools/check_kb_integrity.py

          echo "=== Candidate image passed all gates ==="

      - name: Deploy backend locally on the VPS
        run: |
          set -euo pipefail
          DEPLOY_PATH="/root/tutor-guardian"
          DEPLOY_HEALTH_URL="https://tg-api.alsaba.cloud/health"

          echo "=== Self-hosted deploy ==="
          echo "Date:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deploy path: $DEPLOY_PATH"
          echo "Health URL:  $DEPLOY_HEALTH_URL"
          echo

          cd "$DEPLOY_PATH"

          # ── 1. Record previous SHA for rollback ──────────────────────
          PREVIOUS_SHA=$(git rev-parse HEAD)
          echo "Previous SHA: $PREVIOUS_SHA"

          # ── 2. Pull the latest main ──────────────────────────────────
          echo "→ git fetch + reset --hard origin/main"
          git fetch origin main
          git reset --hard origin/main
          DEPLOY_SHA=$(git rev-parse --short HEAD)
          echo "Deploying SHA: $DEPLOY_SHA"

          # ── 3. Build the new image ───────────────────────────────────
          echo "→ docker compose build backend"
          docker compose -f docker-compose.production.yml build backend

          # ── 3b. Make the data volumes writable by the container user ──
          # The image runs as `appuser` (uid 10001) but Docker creates volume
          # contents as root, so SQLite could read the DB and not write it —
          # `PRAGMA journal_mode = WAL` then fails and the container crashloops
          # on startup. That took production down on 2026-07-25 and had already
          # failed the 2026-07-19 deploy; prod had been surviving on a single
          # container that could never be restarted. Idempotent, so it also
          # covers any freshly created volume.
          echo "→ ensuring volume ownership (uid 10001)"
          for _vol in tutor-guardian_tg_sessions tutor-guardian_tg_chroma; do
            _path=$(docker volume inspect "$_vol" --format '{{.Mountpoint}}' 2>/dev/null || true)
            if [ -n "$_path" ] && [ -d "$_path" ]; then
              chown -R 10001:10001 "$_path" || echo "::warning::chown failed for $_vol"
            fi
          done

          # ── 4. Recreate the container ────────────────────────────────
          echo "→ docker compose up -d backend"
          docker compose -f docker-compose.production.yml up -d --remove-orphans backend

          # ── Helper: rollback to previous SHA ─────────────────────────
          _rollback() {
            echo "::warning::Rolling back to SHA: $PREVIOUS_SHA ..."
            git reset --hard "$PREVIOUS_SHA"
            docker compose -f docker-compose.production.yml build backend
            docker compose -f docker-compose.production.yml up -d --remove-orphans backend
            echo "::warning::Rollback complete."
          }

          # ── 5. Wait for the new container to be healthy ──────────────
          # Cold start loads the embedding model weights + ChromaDB, which
          # routinely takes >60s — give it up to 180s before failing so a
          # slow-but-successful boot isn't reported as a deploy failure.
          echo "→ waiting for container health (up to 180s)"
          STATUS="missing"
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' tg_backend 2>/dev/null || echo "missing")
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
          done

          if [ "$STATUS" != "healthy" ]; then
            echo "::error::tg_backend is not healthy after 180s — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          # ── 6. HTTP smoke test ───────────────────────────────────────
          echo "→ HTTP smoke test: $DEPLOY_HEALTH_URL"
          HTTP_CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "$DEPLOY_HEALTH_URL" || echo "fail")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health URL returned $HTTP_CODE (expected 200) — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          # ── 7. Privacy endpoint (Phase 0 regression) ─────────────────
          PRIVACY_CODE=$(curl -fsS -o /dev/null -w '%{http_code}' "${DEPLOY_HEALTH_URL%/health}/privacy-policy" || echo "fail")
          if [ "$PRIVACY_CODE" != "200" ]; then
            echo "::error::privacy-policy returned $PRIVACY_CODE (expected 200) — triggering rollback"
            _rollback
            exit 1
          fi

          # ── 8. Cleanup candidate image and dangling images (best-effort)
          docker image rm -f "tutor-guardian-backend:candidate-${{ github.sha }}" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true

          echo
          echo "=== Deploy complete ==="
          echo "SHA:  $DEPLOY_SHA"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Post-deploy log tail
        if: always()
        run: |
          echo "=== Last 30 lines of tg_backend (post-deploy) ==="
          docker logs --tail 30 tg_backend 2>&1 || echo "(no logs available)"
