name: Deploy

# Auto-deploy the backend to the VPS on push to main.
#
# Runs ON the self-hosted runner (`vps-tg`) which lives on the VPS itself,
# so it executes the deploy LOCALLY — no SSH, no GitHub-hosted minutes, and
# fully independent of GitHub Actions billing.
#
# Previously this was gated on the "Backend tests" GitHub-hosted workflow, but
# that workflow is disabled to avoid Actions billing. Instead, the deploy job
# builds a *candidate* image and runs pytest + KB integrity inside it BEFORE
# recreating the production container. A red test suite therefore never reaches
# production.
#
# Manual run: Actions → Deploy → "Run workflow" (workflow_dispatch).

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'knowledge_base/**'
      - 'ops/tools/**'
      - 'ops/scripts/**'
      - 'frontend/**'
      - 'docs/lesson_index.json'
      - 'docs/lesson_assets/**'
      - 'docker-compose.production.yml'
      - 'backend/Dockerfile'
      - '.github/workflows/deploy.yml'
      - 'requirements*.txt'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy to VPS (self-hosted)
    runs-on: [self-hosted, production]
    timeout-minutes: 30
    environment:
      name: production
      url: https://tg-api.alsaba.cloud
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build candidate image and run tests
        run: |
          set -euo pipefail
          CANDIDATE_TAG="tutor-guardian-backend:candidate-${{ github.sha }}"

          echo "=== Build candidate image from checked-out workspace ==="
          # Use $GITHUB_WORKSPACE (the commit that triggered this workflow), not
          # /root/tutor-guardian, so tests gate the exact code being deployed.
          cd "$GITHUB_WORKSPACE"
          docker build -f backend/Dockerfile -t "$CANDIDATE_TAG" .

          echo "=== Run backend tests in candidate image ==="
          docker run --rm \
            -e SKIP_API_SMOKE=1 \
            -e PYTHONPATH=/app/backend \
            "$CANDIDATE_TAG" \
            pytest -q

          echo "=== Run KB integrity check in candidate image ==="
          docker run --rm \
            -e PYTHONPATH=/app/backend \
            "$CANDIDATE_TAG" \
            python ops/tools/check_kb_integrity.py

          echo "=== Candidate image passed all gates ==="

          # Promote the tested candidate to the tag compose resolves for this
          # service. Compose derives `<project>-<service>` from the deploy dir,
          # i.e. tutor-guardian-backend:latest, and the service declares no
          # explicit `image:` key — so tagging here lets the deploy step start
          # the *already tested* image instead of rebuilding it.
          #
          # This used to be a second `docker compose build backend` run from
          # /root/tutor-guardian. Different build context = no layer cache reuse,
          # so a ~5.7GB image was built twice per run; "exporting layers" alone
          # measured 238s. Three deploys in a row blew timeout-minutes: 30 and
          # were cancelled mid-export (2026-07-27).
          echo "=== Tag candidate as tutor-guardian-backend:latest ==="
          docker tag "$CANDIDATE_TAG" tutor-guardian-backend:latest

      - name: Deploy backend locally on the VPS
        run: |
          set -euo pipefail
          DEPLOY_PATH="/root/tutor-guardian"
          DEPLOY_HEALTH_URL="https://tg-api.alsaba.cloud/health"

          echo "=== Self-hosted deploy ==="
          echo "Date:        $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Deploy path: $DEPLOY_PATH"
          echo "Health URL:  $DEPLOY_HEALTH_URL"
          echo

          cd "$DEPLOY_PATH"

          # ── 1. Record previous SHA + image for rollback ──────────────
          PREVIOUS_SHA=$(git rev-parse HEAD)
          echo "Previous SHA: $PREVIOUS_SHA"

          # The running container pins its image by ID, so this still resolves
          # to the *old* image even though the previous step already moved the
          # :latest tag onto the new candidate. Capturing it lets rollback
          # restore the exact image that was last verified healthy in
          # production, with no rebuild — see _rollback() below.
          PREVIOUS_IMAGE=$(docker inspect tg_backend --format '{{.Image}}' 2>/dev/null || true)
          echo "Previous image: ${PREVIOUS_IMAGE:-<none>}"

          # ── 2. Pull the latest main ──────────────────────────────────
          echo "→ git fetch + reset --hard origin/main"
          git fetch origin main
          git reset --hard origin/main
          DEPLOY_SHA=$(git rev-parse --short HEAD)
          echo "Deploying SHA: $DEPLOY_SHA"

          # ── 3. Verify the tested image is present ────────────────────
          # No build here: the previous step already built, tested and tagged
          # tutor-guardian-backend:latest. The checkout above still has to be
          # current because the compose file bind-mounts ./docs,
          # ./backend/secrets, ./ops/scripts and ./mobile/assets from this dir.
          echo "→ verifying tutor-guardian-backend:latest exists"
          docker image inspect tutor-guardian-backend:latest >/dev/null

          # ── 3b. Make the data volumes writable by the container user ──
          # The image runs as `appuser` (uid 10001) but Docker creates volume
          # contents as root, so SQLite could read the DB and not write it —
          # `PRAGMA journal_mode = WAL` then fails and the container crashloops
          # on startup. That took production down on 2026-07-25 and had already
          # failed the 2026-07-19 deploy; prod had been surviving on a single
          # container that could never be restarted. Idempotent, so it also
          # covers any freshly created volume.
          echo "→ ensuring volume ownership (uid 10001)"
          for _vol in tutor-guardian_tg_sessions tutor-guardian_tg_chroma; do
            _path=$(docker volume inspect "$_vol" --format '{{.Mountpoint}}' 2>/dev/null || true)
            if [ -n "$_path" ] && [ -d "$_path" ]; then
              chown -R 10001:10001 "$_path" || echo "::warning::chown failed for $_vol"
            fi
          done

          # ── 3c. Make read-only bind mounts readable by the container user ──
          # Same uid mismatch as 3b, other direction: these are host dirs, not
          # volumes. docs/ is rsynced from the dev machine and arrives owned by
          # uid 1000 mode 0600, which uid 10001 cannot read. On 2026-07-27 that
          # left 421 of 1594 docs files unreadable, so /privacy-policy answered
          # 200 with an empty body and Cloudflare turned it into a 520 — the
          # deploy smoke test then rolled back with no usable diagnosis.
          # These three mounts are public content, so a+rX is the right state;
          # backend/secrets is deliberately excluded — it must stay 0600.
          echo "→ ensuring bind-mount readability (docs, ops/scripts, mobile/assets)"
          for _dir in docs ops/scripts mobile/assets; do
            [ -d "$_dir" ] && { chmod -R a+rX "$_dir" || echo "::warning::chmod failed for $_dir"; }
          done

          # Secrets get the opposite treatment: owned by the container user and
          # readable by nobody else. Same 0600 root:root symptom as docs/ — it
          # made _load_credentials() raise PermissionError, so push notifications
          # were dead in production — but a+rX would be the wrong cure here.
          if [ -d backend/secrets ]; then
            echo "→ ensuring secrets are container-readable and private (0400, uid 10001)"
            chown -R 10001:10001 backend/secrets || echo "::warning::chown failed for backend/secrets"
            find backend/secrets -type f -exec chmod 400 {} + || echo "::warning::chmod failed for backend/secrets"
          fi

          # ── 4. Recreate the container ────────────────────────────────
          echo "→ docker compose up -d --no-build backend"
          docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans backend

          # ── Helper: rollback to previous SHA ─────────────────────────
          _rollback() {
            echo "::warning::Rolling back to SHA: $PREVIOUS_SHA ..."
            git reset --hard "$PREVIOUS_SHA"
            # Prefer re-tagging the image that was actually running and healthy
            # before this deploy — it needs no rebuild (a rebuild here would hit
            # the same multi-minute export that caused the timeouts, so a slow
            # rollback is a rollback that gets cancelled). Fall back to building
            # only when there was no prior container, e.g. first-ever deploy.
            if [ -n "$PREVIOUS_IMAGE" ] && docker image inspect "$PREVIOUS_IMAGE" >/dev/null 2>&1; then
              echo "::warning::Restoring previous image $PREVIOUS_IMAGE"
              docker tag "$PREVIOUS_IMAGE" tutor-guardian-backend:latest
              docker compose -f docker-compose.production.yml up -d --no-build --remove-orphans backend
            else
              echo "::warning::No previous image available — rebuilding from $PREVIOUS_SHA"
              docker compose -f docker-compose.production.yml build backend
              docker compose -f docker-compose.production.yml up -d --remove-orphans backend
            fi
            echo "::warning::Rollback complete."
          }

          # ── 5. Wait for the new container to be healthy ──────────────
          # Cold start loads the embedding model weights + ChromaDB, which
          # routinely takes >60s — give it up to 180s before failing so a
          # slow-but-successful boot isn't reported as a deploy failure.
          echo "→ waiting for container health (up to 180s)"
          STATUS="missing"
          for i in $(seq 1 36); do
            sleep 5
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' tg_backend 2>/dev/null || echo "missing")
            echo "  attempt $i: $STATUS"
            [ "$STATUS" = "healthy" ] && break
          done

          if [ "$STATUS" != "healthy" ]; then
            echo "::error::tg_backend is not healthy after 180s — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          # ── 6. HTTP smoke test ───────────────────────────────────────
          # No -f: it makes curl exit non-zero on an HTTP error, so the old
          # `|| echo "fail"` *appended* to the code already on stdout and
          # reported nonsense like "520fail". Without -f curl exits 0 and
          # %{http_code} is the code on its own.
          echo "→ HTTP smoke test: $DEPLOY_HEALTH_URL"
          HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$DEPLOY_HEALTH_URL" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health URL returned $HTTP_CODE (expected 200) — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          # ── 7. Privacy endpoint (Phase 0 regression) ─────────────────
          # -w also reports the body size: this endpoint once answered 200 with
          # zero bytes (unreadable bind-mounted file), which Cloudflare masked
          # as a 520, so an empty body is itself a failure worth naming.
          PRIVACY_OUT=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' --max-time 30 "${DEPLOY_HEALTH_URL%/health}/privacy-policy" || echo "000 0")
          PRIVACY_CODE=${PRIVACY_OUT%% *}
          PRIVACY_BYTES=${PRIVACY_OUT##* }
          if [ "$PRIVACY_CODE" != "200" ] || [ "$PRIVACY_BYTES" -eq 0 ]; then
            echo "::error::privacy-policy returned $PRIVACY_CODE with $PRIVACY_BYTES bytes (expected 200, non-empty) — triggering rollback"
            docker logs --tail 50 tg_backend 2>&1 || true
            _rollback
            exit 1
          fi

          echo
          echo "=== Deploy complete ==="
          echo "SHA:  $DEPLOY_SHA"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Runs on cancellation and failure too, not just success. Cleanup used to
      # be the last block of the deploy step, so the three runs cancelled at the
      # 30-minute mark each stranded a ~13GB candidate image on the VPS.
      - name: Cleanup candidate image
        if: always()
        run: |
          # Untags only — after a successful deploy this image is also tagged
          # :latest and backs the running container, so it survives as :latest.
          docker image rm "tutor-guardian-backend:candidate-${{ github.sha }}" >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true
          docker images tutor-guardian-backend --format '  {{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'

      - name: Post-deploy log tail
        if: always()
        run: |
          echo "=== Last 30 lines of tg_backend (post-deploy) ==="
          docker logs --tail 30 tg_backend 2>&1 || echo "(no logs available)"
