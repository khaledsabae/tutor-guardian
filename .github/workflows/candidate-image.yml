name: Candidate image

# The backend image is built, smoked and published on GitHub-hosted runners —
# the production host only pulls it (deploy.yml). Both use the same composite
# action, .github/actions/backend-image, and the same in-image smoke.
#
#   check   pull requests that change what goes into the image or the smoke:
#           build, run the smoke, then break the image three ways and require
#           the smoke to reject each at the right step — a gate that cannot
#           say no is not a gate. Pushes nothing.
#   verify  manual run ("Run workflow", any branch): the full publish path —
#           push a candidate, pull it back, smoke it, tag it :verify-<sha> —
#           then check an anonymous pull works. Proves the deploy's image job
#           before a merge; :verify-* tags are never deployed.
#
# Not part of the deploy gate. Nothing here touches the VPS.

on:
  pull_request:
    branches: [main]
    paths:
      # The image now bakes the knowledge index (app code + units), so any
      # backend or knowledge-base change can break the build — check them all.
      - 'backend/**'
      - 'knowledge_base/**'
      - 'backend/Dockerfile'
      - 'backend/requirements.txt'
      - '.github/ci/constraints-prod.txt'
      - '.github/ci/requirements-prod.lock'
      - '.github/ci/requirements-dev.lock'
      - '.github/ci/reject-broken-images.sh'
      - '.dockerignore'
      - 'ops/tools/candidate_smoke.py'
      - 'ops/tools/candidate_smoke.sh'
      - 'ops/tools/golden_ci.py'
      - 'ops/tools/golden_ci.sh'
      - 'ops/eval/golden_set.jsonl'
      - 'ops/tests/test_golden_ci.py'
      - '.github/actions/backend-image/**'
      - '.github/workflows/candidate-image.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: candidate-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: candidate image smoke
    # Fork PRs are skipped, as in backend.yml.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read   # the layer cache in GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Golden reporting regression tests (no app/provider)
        run: |
          python3 -m pip install 'pytest>=8,<9'
          # backend_env tests import the retrieval stack; backend.yml runs them
          # with production's package set.
          python3 -m pytest ops/tests/test_golden_ci.py -m "not backend_env" --junitxml="$RUNNER_TEMP/golden-tests.xml"

      - name: Build and smoke (nothing pushed)
        id: image
        uses: ./.github/actions/backend-image
        with:
          mode: check

      # Informational only: real hybrid retrieval over every golden item.
      # Reuses the candidate's baked models/index; no credentials or network.
      - name: Golden retrieval report (nonblocking)
        if: always()
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if [ '${{ steps.image.outcome }}' = 'success' ]; then
            bash ops/tools/golden_ci.sh '${{ steps.image.outputs.image }}' "$RUNNER_TEMP/golden-report"
          else
            GOLDEN_REVISION="$GITHUB_SHA" python3 ops/tools/golden_ci.py \
              --out "$RUNNER_TEMP/golden-report" --unavailable 'Candidate build unavailable'
          fi

      - name: Publish golden scope and counts
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/golden-report/summary.md" ]; then
            cat "$RUNNER_TEMP/golden-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Golden report UNAVAILABLE: reporting step did not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve golden retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-retrieval-${{ github.sha }}
          path: ${{ runner.temp }}/golden-report/
          if-no-files-found: warn
          retention-days: 14

      - name: The smoke rejects broken images
        run: .github/ci/reject-broken-images.sh "${{ steps.image.outputs.image }}"

  verify:
    name: publish path (verify tag)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build, push a candidate, pull it back, smoke it, tag :verify-<sha>
        id: image
        uses: ./.github/actions/backend-image
        with:
          mode: verify

      - name: The smoke rejects broken images
        run: .github/ci/reject-broken-images.sh "${{ steps.image.outputs.image }}"

      # What the production host does: no credentials at all. The registry's
      # token endpoint hands anyone a pull token for a public package; for a
      # private one it answers 403.
      - name: Anonymous pull works (public package)
        env:
          REPO: khaledsabae/tutor-guardian-backend
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -uo pipefail
          code=$(curl -s -o /tmp/anon.json -w '%{http_code}' "https://ghcr.io/token?scope=repository:$REPO:pull&service=ghcr.io")
          if [ "$code" != 200 ]; then
            echo "::warning::GHCR refuses anonymous pulls of $REPO (HTTP $code) — the package is private. One-time fix: https://github.com/users/khaledsabae/packages/container/tutor-guardian-backend/settings → Danger Zone → Change visibility → Public."
            exit 0
          fi
          # The anonymous token goes through a header file, not the command line.
          python3 -c 'import json; print("Authorization: Bearer " + json.load(open("/tmp/anon.json"))["token"])' > /tmp/anon.hdr
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @/tmp/anon.hdr \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$REPO/manifests/$DIGEST")
          rm -f /tmp/anon.hdr /tmp/anon.json
          echo "anonymous manifest fetch of $DIGEST: HTTP $code"
          [ "$code" = 200 ] || echo "::warning::anonymous manifest fetch failed (HTTP $code)"
