# Check this install is marked as test traffic: the CI APK creates the
# onboarding child under the fixed CHILD_NAME (mobile-e2e.yml, "Create the
# onboarding child as test traffic"), so every production row the run writes
# hangs off this child's device_id:
#   child_profiles.name = CHILD_NAME  →  device_id  →  exclude.
# Until 2026-10-21 this flow RENAMED the child. Production answers a rename with
# 403 device_proof_required unless the session proved itself through an FCM
# push, which a CI emulator receives only now and then; the save never left the
# edit screen and the journeys failed at random. Creating needs no proof.
# Runs immediately after onboarding. Env: CHILD_NAME.
appId: com.alsaba.almorabbi
---
- runFlow: open_settings.yaml
# The header is read from GET /api/children: the server has the name. Not
# there = an APK built without ci-child-name — unmarked traffic, so stop.
- extendedWaitUntil:
    visible: '(?s)(?:.*\s)?${CHILD_NAME}(?:\s.*)?'
    timeout: 30000
- tapOn: '${output.lead.settingsEditChild}'
- extendedWaitUntil:
    visible: '${output.t.editChildTitle}'
    timeout: 20000
- assertVisible: '(?s)(?:.*\s)?${CHILD_NAME}(?:\s.*)?'
- takeScreenshot: mark_child_1_edit
# Save unchanged: still a PATCH /api/children/{id} (the edit screen's path),
# but the same name never asks for a proof.
# The app-bar Save: the bottom "Save changes" button can sit under the keyboard.
- tapOn: '${output.t.save}'
# A lost tap leaves the edit screen up; saving twice is the same PATCH.
- extendedWaitUntil:
    visible: '${output.t.settingsTitle}'
    timeout: 20000
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: '${output.t.editChildTitle}'
    commands:
      - takeScreenshot: mark_child_1b_save_retry
      - tapOn: '${output.t.save}'
- extendedWaitUntil:
    visible: '${output.t.settingsTitle}'
    timeout: 30000
- extendedWaitUntil:
    visible: '(?s)(?:.*\s)?${CHILD_NAME}(?:\s.*)?'
    timeout: 30000
- takeScreenshot: mark_child_2_saved
- back
# A keyboard left open would have taken that back press.
- runFlow:
    when:
      notVisible: '${output.t.hubTitle}'
    commands:
      - back
