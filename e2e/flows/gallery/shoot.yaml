# One pass of the before/after gallery (Phase 0 of docs/NOOR_WAL_QANADIL_PLAN.md).
# run.sh runs this flow against the BASELINE build (tag=before) and the PR head
# (tag=after), in Arabic and English, plus a 200% font-scale pass set through
# `adb shell settings put system font_scale` — a runtime system setting, so no
# second AVD and the avd cache key is untouched.
#
# Every screenshot is named ${GALLERY_TAG}__${GALLERY_VARIANT}__<screen> and the
# pairing in e2e/e2e_tool.py gallery looks those names up exactly.
#
# The whole lineage is informational: a step that does not find its element
# fails the flow, never the run — and anything the screen may not show (a
# lesson without a quiz, no follow-up due) is guarded with `when:`/`optional:`.
# Selectors are ARB keys via ../common/l10n.js, re-generated per build, so the
# same flow drives the baseline and the head alike.
#
# Dark mode here is the app's OWN setting (Settings → Appearance), not
# `adb shell cmd uimode night yes`: the plan's Phase 1 touches the app theme,
# and staying inside the app keeps the AVD image — and e2e-avd-cache.yml's
# key — untouched. A 360dp-density variant is deferred for the same reason:
# it needs AVD config (`wm density 360` at boot-time scale or a new profile),
# so adding it means a new AVD_CACHE_KEY suffix in BOTH workflow files.
# Env: UI_LANG (ar|en), GALLERY_TAG (before|after), GALLERY_VARIANT (ar|en|ar_font2x),
#      CHILD_NAME (inherited, unused since today_shot dropped the name wait).
appId: com.alsaba.almorabbi
name: gallery/shoot
---
- runScript: ../common/l10n.js
# Every pass starts from a cold launch, exactly like upgrade/03: after
# `adb install -r` of the PR head (the «after» passes) the app is NOT
# running, and home.yaml's back-walk assumes a live process — the first
# after-pass died on "اليوم not found" because of exactly that.
- launchApp:
    stopApp: true
- runFlow: ../common/system_dialogs.yaml
- extendedWaitUntil:
    visible: '${output.lead.navToday}'
    timeout: 60000
# ── settings, in this shoot's language ──────────────────────────────────
# Ensure language matches UI_LANG before photographing Today or lessons
- runFlow: ../common/open_settings.yaml
- runFlow:
    when:
      true: "${UI_LANG == 'en'}"
      notVisible: '${output.en.settingsTitle}'
    commands:
      - scrollUntilVisible:
          element:
            text: '${output.lead.language}'
          direction: DOWN
          timeout: 20000
      - tapOn: '${output.lead.language}'
- runFlow:
    when:
      true: "${UI_LANG != 'en'}"
      notVisible: '${output.ar.settingsTitle}'
    commands:
      - scrollUntilVisible:
          element:
            text: '${output.lead.language}'
          direction: DOWN
          timeout: 20000
      - tapOn: '${output.lead.language}'
- runFlow:
    when:
      true: "${UI_LANG == 'en'}"
    commands:
      - extendedWaitUntil:
          visible: '${output.en.settingsTitle}'
          timeout: 20000
- runFlow:
    when:
      true: "${UI_LANG != 'en'}"
    commands:
      - extendedWaitUntil:
          visible: '${output.ar.settingsTitle}'
          timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__settings'
# ── the app's own dark mode (Settings → Appearance cycles), then return to Today
# in dark mode to photograph NoorFace, the gift moment, and Home before restoring light.
- scrollUntilVisible:
    element:
      text: '${output.lead.settingsTheme}'
    direction: DOWN
    timeout: 20000
- repeat:
    times: 3
    while:
      notVisible: '${output.tile.settingsThemeDark}'
    commands:
      - tapOn: '${output.lead.settingsTheme}'
      - waitForAnimationToEnd:
          timeout: 3000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__settings_dark'
# Navigate to Today in dark mode
- runFlow: ../common/home.yaml
- extendedWaitUntil:
    visible: '${output.lead.navToday}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__home_dark_noor_face'
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__home_dark_gift'
- runFlow:
    file: today_shot.yaml
    env:
      SHOT: '${GALLERY_TAG}__${GALLERY_VARIANT}__home_dark'
# Restore light theme in Settings
- runFlow: ../common/open_settings.yaml
- scrollUntilVisible:
    element:
      text: '${output.lead.settingsTheme}'
    direction: DOWN
    timeout: 20000
- repeat:
    times: 3
    while:
      notVisible: '${output.tile.settingsThemeLight}'
    commands:
      - tapOn: '${output.lead.settingsTheme}'
      - waitForAnimationToEnd:
          timeout: 3000
# ── Today ────────────────────────────────────────────────────────────────
- runFlow: ../common/home.yaml
- extendedWaitUntil:
    visible: '${output.lead.navToday}'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__noor_face_today'
# Gift moment burst captures (0ms, 150ms, 400ms)
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__gift_moment_0ms'
- waitForAnimationToEnd:
    timeout: 150
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__gift_moment_150ms'
- waitForAnimationToEnd:
    timeout: 250
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__gift_moment_400ms'
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__gift_moment'
- runFlow:
    file: today_shot.yaml
    env:
      SHOT: '${GALLERY_TAG}__${GALLERY_VARIANT}__home'
# ── The Lesson FIRST: complete the lesson before visiting child missions so Today
# stays near the top and the 200% font pass easily reaches the lesson button.
- scrollUntilVisible:
    element:
      text: '(?:${output.t.startThisLesson}|${output.t.continueBtn})'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.t.startThisLesson}'
    commands:
      - tapOn: '${output.t.startThisLesson}'
# «متابعة» on the «واصل مسارك» card. The baseline (what users have, up to
# 1.0.73) opens the path overview and needs a second tap there; the PR head
# opens the due lesson itself and keeps the overview behind «عرض المسار»
# (focusViewPath — a key the baseline's ARB does not have, hence the split).
- runFlow:
    when:
      true: "${GALLERY_TAG != 'after'}"
      visible: '${output.t.continueBtn}'
    commands:
      - tapOn: '${output.t.continueBtn}'
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__path_detail'
      - scrollUntilVisible:
          element:
            text: '(?:${output.t.pathDetailStart}|${output.t.pathDetailContinue})'
          direction: DOWN
          timeout: 30000
      - tapOn: '(?:${output.t.pathDetailStart}|${output.t.pathDetailContinue})'
- runFlow:
    when:
      true: "${GALLERY_TAG == 'after'}"
      visible: '${output.t.continueBtn}'
    commands:
      # The overview is still one tap away, and still photographed.
      - tapOn: '${output.t.focusViewPath}'
      - extendedWaitUntil:
          visible: '(?:${output.t.pathDetailStart}|${output.t.pathDetailContinue})'
          timeout: 30000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__path_detail'
      - back
      - scrollUntilVisible:
          element:
            text: '${output.t.continueBtn}'
          direction: DOWN
          timeout: 20000
      - tapOn: '${output.t.continueBtn}'
      # «متابعة» lands on the lesson (or its error page) — not the overview.
      - extendedWaitUntil:
          visible: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted}|${output.t.lessonErrorLoading})'
          timeout: 45000
      - assertNotVisible: '(?:${output.t.pathDetailStart}|${output.t.pathDetailContinue})'
- extendedWaitUntil:
    visible: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted}|${output.t.lessonErrorLoading})'
    timeout: 45000
    optional: true
# A 5xx from production is the server's moment (see fresh/02): retry twice,
# only for a server status.
- runFlow:
    file: ../common/server_retry.yaml
    env:
      READY: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted})'
      SHOT: '${GALLERY_TAG}__${GALLERY_VARIANT}__lesson_server_error_retry'
- extendedWaitUntil:
    visible: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted})'
    timeout: 30000
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__lesson'
# ── the lesson's quiz, when the lesson has one: answer with the first option
# (the letter circle stays Arabic in both languages) until the summary. The
# quiz button sits in the lesson's assets section, below the fold at 200%
# font — two blind swipes first; the leg stays guarded, so a lesson without a
# quiz simply skips it.
- swipe:
    start: '50%,80%'
    end: '50%,30%'
- swipe:
    start: '50%,80%'
    end: '50%,30%'
- runFlow:
    when:
      visible: '${output.t.lessonQuiz}'
    commands:
      - tapOn: '${output.t.lessonQuiz}'
      - extendedWaitUntil:
          visible: '(?:${output.tile.lit_quizOptionA}|${output.c.quizErrorLoading})'
          timeout: 30000
          optional: true
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__quiz'
      - repeat:
          times: 15
          while:
            notVisible: '${output.t.quizYourResult}'
          commands:
            - tapOn:
                text: '${output.tile.lit_quizOptionA}'
                optional: true
            - waitForAnimationToEnd:
                timeout: 2000
            - tapOn:
                text: '(?:${output.t.quizNextQuestion}|${output.t.quizShowResult})'
                optional: true
            - waitForAnimationToEnd:
                timeout: 1000
      - runFlow:
          when:
            visible: '${output.t.quizYourResult}'
          commands:
            - waitForAnimationToEnd:
                timeout: 3000
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__quiz_summary'
      - runFlow:
          when:
            visible: '(?:${output.c.lessonQuiz}|${output.c.quizErrorLoading})'
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 2000
# ── completion: the celebration dialog, then the "tonight's step" sheet.
- runFlow:
    when:
      visible: '${output.t.lessonMarkComplete}'
    commands:
      - tapOn: '${output.t.lessonMarkComplete}'
      - extendedWaitUntil:
          visible: '(?:${output.t.lessonCelebrationTitle}|${output.t.continueBtn})'
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__celebration'
      # The dialog's own button defaults to the same «متابعة» / Continue label.
      - tapOn:
          text: '${output.t.continueBtn}'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: '${output.c.lessonNextStepTitle}'
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__next_step'
      # Head builds ask «متى ستجرّبها؟» with three slots instead of one
      # confirm (phase 2, حلقة الوعد); the baseline never shows the slots.
      # Each tap is gated on its own button, NOT `optional: true`: a failed
      # optional step makes Maestro dump the hierarchy under a file named
      # after the selector (step-N-tapOnElement-<selector>.json), and
      # verify-hierarchy reads «lesson» in that name as the lesson screen —
      # the after passes went red on run 38610466087 while the flow passed.
      # A `when` that is false is SKIPPED and dumps nothing.
      - runFlow:
          when:
            visible: '${output.t.lessonNextStepConfirm}'
          commands:
            - tapOn: '${output.t.lessonNextStepConfirm}'
      - runFlow:
          when:
            visible: '${output.t.promiseTonight}'
          commands:
            - tapOn: '${output.t.promiseTonight}'
- runFlow:
    when:
      visible: '${output.c.reviewPromptTitle}'
    commands:
      - tapOn:
          text: '${output.t.reviewPromptLater}'
          optional: true
- runFlow: ../common/home.yaml
- runFlow:
    file: today_shot.yaml
    env:
      SHOT: '${GALLERY_TAG}__${GALLERY_VARIANT}__home_after_lesson'
# A due follow-up, if the server happens to have one for this child: the card
# on Today, then the sheet with an answer chosen.
- runFlow:
    when:
      visible: '${output.c.followupTitle}'
    commands:
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__followup_card'
      - tapOn:
          text: '${output.t.followupWorked}'
          optional: true
      - extendedWaitUntil:
          visible: '${output.c.followupThanksTitle}'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '${output.c.followupThanksTitle}'
          commands:
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__followup'
            - back
# Still-open sheet (the answer never reached the thanks view): close it so Today is clear
- runFlow:
    when:
      visible: '${output.c.followupTitleFor}'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 2000
# ── «قناديل الأسبوع» (نور والقناديل phase 3): the lantern row under ① on
# Today, the lesson above having lit one. Guarded twice: a server without
# /api/family/week shows no row, and the baseline build has no such ARB key
# (its selector never matches) — the screen is in GALLERY_GUARDED.
- tapOn: '${output.lead.navToday}'
- scrollUntilVisible:
    element:
      text: '${output.c.weekLanternsTitle}'
    direction: DOWN
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: '${output.c.weekLanternsTitle}'
    commands:
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__week_lanterns'
# No row: the search above ran Today to its bottom, past ③. Tapping the Today
# tab keeps that offset, and the praise leg only searches DOWN — run
# 38688818497 lost every 7–12 praise shot (and at 200% font the 4–6 one) to
# it. Bring ③'s button back into view first. With a row, ③ is still below it.
- runFlow:
    when:
      notVisible: '${output.c.weekLanternsTitle}'
    commands:
      - scrollUntilVisible:
          element:
            text: '${output.t.todayMissionOpen}'
          direction: UP
          timeout: 20000
          optional: true
# ── Praise Card: Praise moment from family, both 7–12 (sticker+text) and 4–6 (sticker only).
# Step 1: Child 1 (7-9) opens child mode and marks mission done.
- tapOn: '${output.lead.navToday}'
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: '${output.t.todayMissionOpen}'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.t.todayMissionOpen}'
    commands:
      - tapOn: '${output.t.todayMissionOpen}'
      - runFlow: ../common/unlock_child_mode.yaml
      - extendedWaitUntil:
          visible: '(?:${output.t.missionDone}|${output.t.missionTodayLabel})'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '${output.t.missionDone}'
          commands:
            - tapOn: '${output.t.missionDone}'
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow: ../common/exit_child_mode.yaml

# Step 2: Parent opens claimed mission and confirms with kind words ("فخورون بك")
- tapOn: '${output.lead.navMore}'
# UP first, as in Step 6: the hub can keep the offset the Settings shots left
# it at (its bottom), and a DOWN search from there finds nothing — run
# 39649673035 lost ar_font2x's praise_card_* and praise_child_sticker_and_text
# to it (no shot of Steps 2–3 at all).
- scrollUntilVisible:
    element:
      text: '${output.tile.hubParentDay}'
    direction: UP
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      text: '${output.tile.hubParentDay}'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.tile.hubParentDay}'
    commands:
      - tapOn: '${output.tile.hubParentDay}'
      - extendedWaitUntil:
          visible: '(?:أكّدها|Confirm)'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '(?:أكّدها|Confirm)'
          commands:
            - tapOn: '(?:أكّدها|Confirm)'
            - extendedWaitUntil:
                visible: '${output.t.missionConfirmAll}'
                timeout: 15000
                optional: true
            - scrollUntilVisible:
                element:
                  text: '${output.t.praiseChipProud}'
                direction: DOWN
                timeout: 15000
                optional: true
            - tapOn:
                text: '${output.t.praiseChipProud}'
                optional: true
            - tapOn: '${output.t.missionConfirmAll}'
            - waitForAnimationToEnd:
                timeout: 2000
      # Step 3: Child 1 (7-9) re-opens child mode: PraiseHeader appears with sticker AND text!
      # The confirm sheet can still be up (Step 7, run 38815483981). Close it first.
      - runFlow:
          when:
            visible: '${output.t.missionConfirmAll}'
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 2000
      - scrollUntilVisible:
          element:
            text: '${output.t.missionOpenForChild}'
          direction: DOWN
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible: '${output.t.missionOpenForChild}'
          commands:
            - tapOn: '${output.t.missionOpenForChild}'
            - runFlow: ../common/unlock_child_mode.yaml
            - extendedWaitUntil:
                visible: '${output.c.praiseFromFamily}'
                timeout: 15000
                optional: true
            # Burst captures for praise card entrance and tilt (0ms, 150ms, 400ms)
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__praise_card_0ms'
            - waitForAnimationToEnd:
                timeout: 150
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__praise_card_150ms'
            - waitForAnimationToEnd:
                timeout: 250
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__praise_card_400ms'
            # 7-12 Praise card: sticker AND text
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__praise_child_sticker_and_text'
            - runFlow: ../common/exit_child_mode.yaml
- runFlow: ../common/home.yaml

# Step 4: Add and switch to a 4-6 child (Salma) so praise_child_sticker is truly for the 4-6 band (sticker only)
- runFlow: ../common/open_settings.yaml
- scrollUntilVisible:
    element:
      text: '${output.lead.settingsSwitchChild}'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.lead.settingsSwitchChild}'
    commands:
      - tapOn: '${output.lead.settingsSwitchChild}'
      - extendedWaitUntil:
          visible: '${output.t.childrenAddNew}'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '${output.t.childrenAddNew}'
          commands:
            - tapOn: '${output.t.childrenAddNew}'
            - extendedWaitUntil:
                visible: '${output.t.addChildNameHint}'
                timeout: 15000
                optional: true
            - runFlow:
                file: ../common/tap_field_end.yaml
                env:
                  FIELD: '${output.t.addChildNameHint}'
            - inputText: 'Salma'
            - scrollUntilVisible:
                element:
                  text: '${output.t.ageGroup4to6}'
                direction: DOWN
                timeout: 15000
                optional: true
            - tapOn:
                text: '${output.t.ageGroup4to6}'
                optional: true
            - tapOn:
                text: '${output.t.addChildBtn}'
                optional: true
            - tapOn:
                text: '${output.t.add}'
                optional: true
            - waitForAnimationToEnd:
                timeout: 3000
            - extendedWaitUntil:
                visible: 'Salma'
                timeout: 15000
                optional: true
            - tapOn:
                text: 'Salma'
                optional: true
            - waitForAnimationToEnd:
                timeout: 2000
- runFlow: ../common/home.yaml

# Step 5: Child 2 (4-6) marks their mission done
- tapOn: '${output.lead.navToday}'
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element:
      text: '${output.t.todayMissionOpen}'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.t.todayMissionOpen}'
    commands:
      - tapOn: '${output.t.todayMissionOpen}'
      - runFlow: ../common/unlock_child_mode.yaml
      - extendedWaitUntil:
          visible: '(?:${output.t.missionDone}|${output.t.missionTodayLabel})'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '${output.t.missionDone}'
          commands:
            - tapOn: '${output.t.missionDone}'
            - waitForAnimationToEnd:
                timeout: 2000
      - runFlow: ../common/exit_child_mode.yaml
- runFlow: ../common/home.yaml

# Step 6: Parent confirms Child 2's mission with kind words
- tapOn: '${output.lead.navMore}'
# The hub can keep the offset Step 4's Settings visit left it at — its
# bottom, below «يوم الطفل ومهامه» — and a DOWN search from there finds
# nothing (run 38777734035 lost ar_font2x's praise_child_sticker to it). Look
# UP first; from the top, the DOWN search below still does the work.
- scrollUntilVisible:
    element:
      text: '${output.tile.hubParentDay}'
    direction: UP
    timeout: 10000
    optional: true
- scrollUntilVisible:
    element:
      text: '${output.tile.hubParentDay}'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.tile.hubParentDay}'
    commands:
      - tapOn: '${output.tile.hubParentDay}'
      - extendedWaitUntil:
          visible: '(?:أكّدها|Confirm)'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '(?:أكّدها|Confirm)'
          commands:
            - tapOn: '(?:أكّدها|Confirm)'
            - extendedWaitUntil:
                visible: '${output.t.missionConfirmAll}'
                timeout: 15000
                optional: true
            - scrollUntilVisible:
                element:
                  text: '${output.t.praiseChipProud}'
                direction: DOWN
                timeout: 15000
                optional: true
            - tapOn:
                text: '${output.t.praiseChipProud}'
                optional: true
            - tapOn: '${output.t.missionConfirmAll}'
            - waitForAnimationToEnd:
                timeout: 2000
      # Step 7: Child 2 (4-6) re-opens child mode: PraiseHeader appears with STICKER ONLY!
      # The confirm sheet can still be up (run 38815483981: the DOWN search
      # below then ran inside it and missed the button). Close it first.
      - runFlow:
          when:
            visible: '${output.t.missionConfirmAll}'
          commands:
            - back
            - waitForAnimationToEnd:
                timeout: 2000
      - scrollUntilVisible:
          element:
            text: '${output.t.missionOpenForChild}'
          direction: DOWN
          timeout: 20000
          optional: true
      - runFlow:
          when:
            visible: '${output.t.missionOpenForChild}'
          commands:
            - tapOn: '${output.t.missionOpenForChild}'
            - runFlow: ../common/unlock_child_mode.yaml
            - extendedWaitUntil:
                visible: '${output.c.praiseFromFamily}'
                timeout: 15000
                optional: true
            # 4-6 Praise card: sticker ONLY
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__praise_child_sticker'
            - runFlow: ../common/exit_child_mode.yaml
# Still on «يوم الطفل» if Step 7 found no button: leave it by hand. home.yaml
# cannot — its «اليوم» check also matches this screen's «اليوم مع …», so it
# taps that line and stays (run 38815483981 lost every shot after it).
- runFlow:
    when:
      visible: '${output.t.parentDayTitle}'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: ../common/home.yaml

# ── «درب {الاسم}» (عالم الأسرة): the family road, opened from its row at the
# top of «تعلّم» (not from Today's strip — that would move Today's scroll for
# the tour below). Head builds only: the baseline has no row, its selector
# never matches, and both shots are in GALLERY_GUARDED. The lesson above lit
# a lantern, so «ما أضأتموه» has something on it.
- tapOn: '${output.lead.navLearn}'
- extendedWaitUntil:
    visible: '${output.t.pathsTitle}'
    timeout: 30000
- runFlow:
    when:
      visible: '${output.c.familyRoadEntryBody}'
    commands:
      - tapOn: '${output.c.familyRoadEntryBody}'
      - extendedWaitUntil:
          visible: '${output.c.familyRoadHorizon}'
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__family_road'
      - scrollUntilVisible:
          element:
            text: '${output.c.familyRoadLit}'
          direction: DOWN
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '${output.c.familyRoadLit}'
          commands:
            - waitForAnimationToEnd:
                timeout: 2000
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__family_road_lit'
      - back
- runFlow: ../common/home.yaml

# ── «ركن الطفل»: the gate's first tile, the corner, a page of the day's
# story, and the task the session ends on (no game in the corner for this
# launch), for the 4-6 child the praise leg left active. Head only — the baseline has no
# corner, so every shot is guarded and the gate is simply left. Ends back on
# Today through the PIN. After the praise leg and before the tour, so a corner
# that goes wrong can cost no shot but the tour's.
- tapOn: '${output.lead.navMore}'
# The hub's routine tile is named by the active child's age, and the praise
# leg above left a 4-6 child active: «حساب اليوم», not «ميزان العادات».
- scrollUntilVisible:
    element:
      text: '(?:${output.tile.routineTitle}|${output.tile.routineDailyTracker})'
    direction: UP
    timeout: 20000
    optional: true
- tapOn:
    text: '(?:${output.tile.routineTitle}|${output.tile.routineDailyTracker})'
    optional: true
- extendedWaitUntil:
    visible: '${output.t.routineChildMode}'
    timeout: 20000
    optional: true
- tapOn:
    text: '${output.t.routineChildMode}'
    optional: true
- extendedWaitUntil:
    visible: '${output.t.handoverTitle}'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: '${output.lead.childCornerTileTitle}'
    commands:
      - tapOn: '${output.lead.childCornerTileTitle}'
      - runFlow: ../common/unlock_child_mode.yaml
      - extendedWaitUntil:
          visible: '${output.c.childCornerGreeting}'
          timeout: 30000
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__child_corner'
      - tapOn:
          text: '${output.c.childCornerStoryHint}'
          optional: true
      - extendedWaitUntil:
          visible: '${output.t.childCornerStoryNext}'
          timeout: 15000
          optional: true
      - runFlow:
          when:
            visible: '${output.t.childCornerStoryNext}'
          commands:
            - tapOn: '${output.t.childCornerStoryNext}'
            - waitForAnimationToEnd:
                timeout: 1500
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__child_corner_story'
            # Back in a story closes it, back to the corner.
            - back
            - waitForAnimationToEnd:
                timeout: 2000
      - scrollUntilVisible:
          element:
            text: '${output.t.childCornerToMission}'
          direction: DOWN
          timeout: 10000
          optional: true
      - tapOn:
          text: '${output.t.childCornerToMission}'
          optional: true
      - extendedWaitUntil:
          visible: '${output.t.childCornerMissionNow}'
          timeout: 15000
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__child_corner_task'
      - scrollUntilVisible:
          element:
            text: '${output.t.childCornerMissionGo}'
          direction: DOWN
          timeout: 10000
          optional: true
      - tapOn:
          text: '${output.t.childCornerMissionGo}'
          optional: true
      - waitForAnimationToEnd:
          timeout: 2000
      - runFlow: ../common/exit_child_mode.yaml
- runFlow:
    when:
      visible: '${output.t.handoverTitle}'
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow: ../common/home.yaml

# ── «القصص» (docs/STORIES_AUDIT.md): the shelf, then what a tap on the
# first book opens — the baseline's adhkar gate, the head's own first leaf
# with Noor — then the head's first page. Reached from المزيد → the hub's
# «قصص قبل النوم» tile in both lineages; the first book's title is content,
# not ARB, so it is a literal. Every shot after the shelf is guarded: the
# baseline's carousel may centre another book, and the page shot is head-only.
- runFlow: ../common/home.yaml
- tapOn: '${output.lead.navMore}'
- scrollUntilVisible:
    element:
      text: '${output.tile.bedtimeStories}'
    direction: DOWN
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: '${output.tile.bedtimeStories}'
    commands:
      - tapOn: '${output.tile.bedtimeStories}'
      - extendedWaitUntil:
          visible: '${output.c.lit_storyFirstTitle}'
          timeout: 20000
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__stories_shelf'
      - runFlow:
          when:
            visible: '${output.c.lit_storyFirstTitle}'
          commands:
            - tapOn: '${output.c.lit_storyFirstTitle}'
            - waitForAnimationToEnd:
                timeout: 3000
            - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__stories_open'
            - runFlow:
                when:
                  visible: '${output.t.storyReadTogether}'
                commands:
                  - tapOn: '${output.t.storyReadTogether}'
                  - waitForAnimationToEnd:
                      timeout: 3000
                  - takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__stories_page'
            - back
            - waitForAnimationToEnd:
                timeout: 2000
      - back
      - waitForAnimationToEnd:
          timeout: 2000
# ── the tour's first mark: before = version 2 on the Today tab, after =
# version 3 on ① ─────────────────────────────────────────────────────────
# Re-armed through Settings → «الجولة التعريفية», the parent's own replay row
# (both lineages have it). The baseline starts version 2 the moment Settings
# pops; the head waits for Today («ستظهر الجولة عند عودتك إلى الشاشة
# الرئيسية»), so Today is tapped only while nothing is up yet — a tap on the
# baseline's veil would move its tour on a stop. Last in the flow on purpose:
# nothing here can cost another shot (tour_mark is guarded in e2e_tool.py).
- runFlow: ../common/open_settings.yaml
- scrollUntilVisible:
    element:
      text: '${output.lead.tourReplay}'
    direction: DOWN
    timeout: 20000
- tapOn: '${output.lead.tourReplay}'
- back
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: '${output.t.tourSkip}'
    commands:
      - tapOn: '${output.lead.navToday}'
- extendedWaitUntil:
    visible: '${output.t.tourSkip}'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: '${GALLERY_TAG}__${GALLERY_VARIANT}__tour_mark'
- repeat:
    times: 6
    while:
      visible: '${output.t.tourSkip}'
    commands:
      - tapOn: '${output.t.tourSkip}'
      - waitForAnimationToEnd:
          timeout: 3000
