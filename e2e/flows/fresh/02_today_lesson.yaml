# Checkpoint 2 — Today's step opens the first lesson for the child's age, and
# back returns to Today (which now offers to continue).
appId: com.alsaba.almorabbi
name: fresh/02 Today → first lesson → back
---
- runScript: ../common/l10n.js
- runFlow: ../common/home.yaml
- runFlow:
    file: ../common/assert_today.yaml
    env:
      SHOT: today_before_lesson
- tapOn: '${output.t.startThisLesson}'
# Either outcome ends the wait: the lesson, or the lesson's error page.
- extendedWaitUntil:
    visible: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted}|${output.t.lessonErrorLoading})'
    timeout: 45000
    optional: true
# A 5xx from the production server is the server's moment, not this build's:
# on 2026-10-08 Cloudflare answered 502 and the page offered Retry. Retry as a
# parent would, at most twice, and only for a server status — a client-side
# error, a timeout or a 4xx is left to fail below.
- runFlow:
    file: ../common/server_retry.yaml
    env:
      READY: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted})'
      SHOT: lesson_server_error_retry
# The bottom button exists only once the lesson payload loaded for this child.
# 30 s: room for the last Retry's reload; a loaded lesson passes at once.
- extendedWaitUntil:
    visible: '(?:${output.t.lessonMarkComplete}|${output.t.lessonCompleted})'
    timeout: 30000
- assertNotVisible: '${output.c.lit_errorWidget}'
- takeScreenshot: lesson_first
- back
- runFlow:
    file: ../common/assert_today.yaml
    env:
      SHOT: today_after_lesson
