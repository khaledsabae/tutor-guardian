# Checkpoint 10 — «ركن الطفل»: through the hand-over gate into the child's
# corner, the day's story read to its end, a level of the day's game left from
# its pause menu, and the session ending on the task away from the screen —
# then «أعِد الجهاز إلى أهلك» and the PIN out.
# The child onboarding created is 7-9, so the corner holds all three parts
# (story, game, task) — the game only when the interface is Arabic, which is
# why the flow switches back from 06's English first. The PIN was set by
# 04_child_mode. The steps still follow what the corner shows, so a corner
# without its game (an English run) ends on the task all the same.
appId: com.alsaba.almorabbi
name: fresh/10 child corner — story, game, task, hand back
---
- runScript: ../common/l10n.js
- runFlow: ../common/home.yaml
# Back to Arabic first (06 left the interface in English): the game packs are
# Arabic-only, so only an Arabic corner has the game to walk through.
- runFlow: ../common/open_settings.yaml
- scrollUntilVisible:
    element:
      text: '${output.lead.language}'
    direction: DOWN
    timeout: 20000
- runFlow:
    when:
      notVisible: '${output.ar.settingsTitle}'
    commands:
      - tapOn: '${output.lead.language}'
- extendedWaitUntil:
    visible: '${output.ar.settingsTitle}'
    timeout: 20000
- back
- runFlow: ../common/home.yaml
- tapOn: '${output.lead.navMore}'
- scrollUntilVisible:
    element:
      text: '${output.tile.routineTitle}'
    direction: UP
    timeout: 20000
- tapOn: '${output.tile.routineTitle}'
- extendedWaitUntil:
    visible: '${output.t.routineChildMode}'
    timeout: 30000
- tapOn: '${output.t.routineChildMode}'
- extendedWaitUntil:
    visible: '${output.t.handoverTitle}'
    timeout: 20000
# The corner is the gate's first tile; title + one-line description merge.
- tapOn: '${output.lead.childCornerTileTitle}'
- runFlow: ../common/unlock_child_mode.yaml
- extendedWaitUntil:
    visible: '${output.c.childCornerGreeting}'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: child_corner_1_home
# The story card merges label, title and hint into one tappable node.
- tapOn: '${output.c.childCornerStoryHint}'
- extendedWaitUntil:
    visible: '${output.t.childCornerStoryNext}'
    timeout: 20000
- takeScreenshot: child_corner_2_story
- repeat:
    times: 10
    while:
      visible: '${output.t.childCornerStoryNext}'
    commands:
      - tapOn: '${output.t.childCornerStoryNext}'
      - waitForAnimationToEnd:
          timeout: 1500
- extendedWaitUntil:
    visible: '${output.t.childCornerBackToCorner}'
    timeout: 10000
- tapOn: '${output.t.childCornerBackToCorner}'
# Back in the corner the story card says «قرأناها معًا» — unless the story was
# all there was (an English interface has no game: the packs are Arabic), in
# which case the task has come up on its own already.
- extendedWaitUntil:
    visible: '(?:${output.c.childCornerStoryDone}|${output.c.childCornerMissionNow})'
    timeout: 15000
- takeScreenshot: child_corner_3_after_story
# The game, when the corner has one: a level of the day's game, no score.
# Back pauses it; «خروج» leaves it — and with the story read too, the task
# comes up on its own.
- scrollUntilVisible:
    element:
      text: '${output.c.childCornerGameHint}'
    direction: DOWN
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: '${output.c.childCornerGameHint}'
    commands:
      - tapOn: '${output.c.childCornerGameHint}'
      - extendedWaitUntil:
          visible: '${output.c.eduGameLevelTitle}'
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: child_corner_4_game
      - back
      - extendedWaitUntil:
          visible: '${output.t.eduGameQuit}'
          timeout: 10000
      - tapOn: '${output.t.eduGameQuit}'
# Whatever was left, the session ends on the task.
- extendedWaitUntil:
    visible: '${output.c.childCornerMissionNow}'
    timeout: 20000
- takeScreenshot: child_corner_5_task
- scrollUntilVisible:
    element:
      text: '${output.t.childCornerMissionGo}'
    direction: DOWN
    timeout: 10000
- tapOn: '${output.t.childCornerMissionGo}'
- extendedWaitUntil:
    visible: '${output.c.childReturnDevice}'
    timeout: 15000
- takeScreenshot: child_corner_6_hand_back
# The device goes back: the frame's Exit, behind the parent's PIN.
- runFlow: ../common/exit_child_mode.yaml
- extendedWaitUntil:
    visible: '${output.lead.navToday}'
    timeout: 30000
