# Checkpoint 3 — force-stop and cold start with real state on disk: Today must
# render, not a white screen or a spinner that never ends.
appId: com.alsaba.almorabbi
name: fresh/03 force-stop → relaunch → Today
---
- runScript: ../common/l10n.js
- stopApp
- launchApp:
    stopApp: true
- runFlow: ../common/system_dialogs.yaml
- runFlow:
    file: ../common/assert_today.yaml
    env:
      SHOT: relaunch_today
