# Upgrade test — the PR head installed over the baseline (`install -r`, data
# kept): it opens in the language the parent chose and Today renders. Whether
# it is still the same family is checkpoint 04.
appId: com.alsaba.almorabbi
name: upgrade/03 after upgrade → Today renders
---
- runScript: ../common/l10n.js
- launchApp:
    stopApp: true
- runFlow: ../common/system_dialogs.yaml
- extendedWaitUntil:
    visible: '${output.lead.navToday}'
    timeout: 60000
- runFlow: ../common/skip_tour.yaml
- runFlow:
    file: ../common/assert_today.yaml
    env:
      SHOT: upgrade_3_after_upgrade_today
      NEED_CHILD: "false"
- assertVisible: '(?s)${output.en.navToday}(?:\s.*)?'
